<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>태연 — 파이프라인 테스트</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --plum-deep: #1c1220; --plum-mid: #2c1d33; --violet: #4a2f52;
    --gold: #cf9b4e; --gold-soft: #e8c78a; --rose: #c07b7f;
    --cream: #f1e7dc; --cream-dim: #b7a99a; --danger: #a85a4f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at 50% -10%, var(--plum-mid), var(--plum-deep) 60%);
    color: var(--cream);
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    overscroll-behavior: none;
  }
  #app {
    max-width: 480px; margin: 0 auto; height: 100dvh;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header { padding: 18px 20px 12px; text-align: center; border-bottom: 1px solid rgba(232,199,138,0.12); }
  header .eyebrow { font-size: 12px; color: var(--cream-dim); margin: 0 0 4px; }
  header h1 { font-size: 20px; font-weight: 600; margin: 0; color: var(--gold-soft); }
  #meta { font-size: 11px; color: var(--cream-dim); margin-top: 6px; line-height: 1.5; }

  #setup { padding: 28px 24px; text-align: center; }
  #setup p { color: var(--cream-dim); font-size: 14px; line-height: 1.6; margin: 0 0 16px; }
  #setup .warn { color: var(--rose); font-size: 13px; display: none; }
  #googleBtnWrap { display: flex; justify-content: center; margin-bottom: 12px; }
  .hidden { display: none !important; }
  #startBtn {
    background: var(--gold); color: #2a1a10; border: 0; border-radius: 999px;
    padding: 14px 32px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  #startBtn:disabled { opacity: .5; }

  #log { flex: 1; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; flex-direction: column; max-width: 88%; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.ai { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word;
  }
  .user .bubble { background: var(--violet); border-bottom-right-radius: 4px; }
  .ai .bubble { background: rgba(241,231,220,0.09); border-bottom-left-radius: 4px; }
  .bubble.pending { opacity: .6; }
  .stats { font-size: 11px; color: var(--cream-dim); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .sys { align-self: center; font-size: 12px; color: var(--cream-dim); text-align: center; max-width: 92%; }
  .sys.err { color: var(--rose); }

  #bar {
    display: flex; gap: 8px; align-items: center; padding: 10px 12px 12px;
    border-top: 1px solid rgba(232,199,138,0.12); background: rgba(28,18,32,0.9);
  }
  #bar button {
    flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(241,231,220,0.12); color: var(--cream); font-size: 18px;
  }
  #bar button:disabled { opacity: .4; cursor: default; }
  #micBtn.rec { background: var(--danger); animation: pulse 1.2s infinite; width: auto; border-radius: 22px; padding: 0 16px; font-size: 13px; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .65; } }
  #sendBtn { background: var(--gold) !important; color: #2a1a10 !important; font-size: 16px !important; font-weight: 700; }
  #txt {
    flex: 1; min-width: 0; height: 44px; border-radius: 22px; border: 1px solid rgba(232,199,138,0.25);
    background: rgba(241,231,220,0.06); color: var(--cream); padding: 0 16px; font-size: 16px; outline: none;
  }
  #txt:focus { border-color: var(--gold); }
</style>
</head>
<body>
<div id="app">
  <header>
    <p class="eyebrow">파이프라인 모드 · Gemini Live 안 씀</p>
    <h1 id="title">태연</h1>
    <div id="meta"></div>
  </header>

  <div id="setup">
    <p id="setupText">불러오는 중…</p>
    <div id="googleBtnWrap" class="hidden"></div>
    <p class="warn" id="setupWarn"></p>
    <button id="startBtn" style="display:none">시작하기</button>
  </div>

  <div id="log" class="hidden"></div>

  <div id="bar" class="hidden">
    <button id="stopBtn" title="목소리 멈추기" disabled>■</button>
    <button id="micBtn" title="눌러서 말하기 / 다시 누르면 전송" disabled>🎤</button>
    <input id="txt" type="text" placeholder="글자로 말하기" autocomplete="off" enterkeyhint="send">
    <button id="sendBtn" title="보내기" disabled>↑</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  // ----- 설정 -----
  //  ?tts=off : 목소리 없이 글자만 (모델 속도만 따로 재볼 때)
  //  &vid=보이스ID : 서버의 ELEVENLABS_VOICE_ID 대신 이 보이스로 일시 변경
  const Q = new URLSearchParams(location.search);
  const TTS_OFF = Q.get('tts') === 'off';
  const VOICE_ID = (Q.get('vid') || '').trim();
  const AUTH_TOKEN_KEY = 'taeyeon_auth_token';   // 기존 웹앱과 같은 키 -> 거기서 로그인했으면 여기서도 유지됨
  const MAX_REC_SEC = 60;
  const MAX_TURNS_KEPT = 40;

  const $ = (id) => document.getElementById(id);
  const setup = $('setup'), setupText = $('setupText'), setupWarn = $('setupWarn');
  const startBtn = $('startBtn'), googleBtnWrap = $('googleBtnWrap');
  const logEl = $('log'), bar = $('bar'), txt = $('txt');
  const sendBtn = $('sendBtn'), micBtn = $('micBtn'), stopBtn = $('stopBtn');

  let authToken = null;
  try { authToken = localStorage.getItem(AUTH_TOKEN_KEY); } catch (_) {}
  let googleClientId = '', personaName = '태연';

  // 세션 상태
  let ctx = '', sig = '';            // 서버가 만든 '이번 접속 이전의 기억' 블록과 그 서명
  let turns = [];                    // 이번 접속 중 오간 대화 [{role:'user'|'model', text}]
  let geo = { lat: null, lng: null };
  let ttsAvailable = false;
  let searchOffNoted = false;        // '검색 한도 초과' 안내는 접속당 한 번만
  let modelTags = false;             // 서버가 '본 모델이 감정 태그를 직접 쓰는 모드'인지
  let busy = false;                  // 대답을 받아오는 중 (스트림이 끝나면 풀림)

  const authHeaders = () => (authToken ? { Authorization: 'Bearer ' + authToken } : {});

  // ----- 로그 UI -----
  function scrollDown() { logEl.scrollTop = logEl.scrollHeight; }
  function addSys(text, isErr) {
    const d = document.createElement('div');
    d.className = 'sys' + (isErr ? ' err' : '');
    d.textContent = text;
    logEl.appendChild(d); scrollDown();
    return d;
  }
  function addRow(who, text, pending) {
    const row = document.createElement('div'); row.className = 'row ' + who;
    const b = document.createElement('div'); b.className = 'bubble' + (pending ? ' pending' : ''); b.textContent = text;
    const st = document.createElement('div'); st.className = 'stats';
    row.appendChild(b); row.appendChild(st);
    logEl.appendChild(row); scrollDown();
    return { row, bubble: b, stats: st };
  }
  const sec = (ms) => (ms / 1000).toFixed(1) + '초';

  // ----- 로그인 (기존 웹앱과 동일한 흐름) -----
  function requireLogin(message) {
    authToken = null;
    try { localStorage.removeItem(AUTH_TOKEN_KEY); } catch (_) {}
    setup.classList.remove('hidden'); logEl.classList.add('hidden'); bar.classList.add('hidden');
    startBtn.style.display = 'none';
    setupText.textContent = message || '구글 계정으로 로그인해야 입장할 수 있어요.';
    renderGoogleButton();
  }
  function renderGoogleButton() {
    if (!googleClientId || !window.google || !google.accounts || !google.accounts.id) { setTimeout(renderGoogleButton, 300); return; }
    googleBtnWrap.classList.remove('hidden'); googleBtnWrap.innerHTML = '';
    google.accounts.id.initialize({ client_id: googleClientId, callback: onGoogleCredential });
    google.accounts.id.renderButton(googleBtnWrap, { theme: 'filled_black', size: 'large', shape: 'pill', text: 'continue_with', locale: 'ko' });
  }
  async function onGoogleCredential(resp) {
    googleBtnWrap.classList.add('hidden'); setupText.textContent = '로그인 확인 중…';
    try {
      const res = await fetch('/api/auth/google', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: resp.credential }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.sessionToken) { setupText.textContent = '허용되지 않은 구글 계정이에요.'; renderGoogleButton(); return; }
      authToken = data.sessionToken;
      try { localStorage.setItem(AUTH_TOKEN_KEY, authToken); } catch (_) {}
      showStart();
    } catch (_) { setupText.textContent = '로그인 확인에 실패했어요. 네트워크를 확인해주세요.'; renderGoogleButton(); }
  }
  function showStart() {
    googleBtnWrap.classList.add('hidden');
    setupText.textContent = personaName + '과 대화를 시작해요. (글자 입력 또는 🎤 눌러서 말하기)';
    startBtn.style.display = 'inline-block'; startBtn.disabled = false;
  }

  async function init() {
    let authRequired = false;
    try {
      const data = await (await fetch('/api/config')).json();
      authRequired = !!data.authRequired; googleClientId = data.googleClientId || '';
      if (data.personaName) { personaName = data.personaName; $('title').textContent = personaName; document.title = personaName + ' — 파이프라인 테스트'; }
    } catch (_) { /* 설정 조회 실패 시 로그인 없이 진행 - 실제 실패는 시작 단계에서 드러남 */ }
    if (!authRequired || authToken) { showStart(); return; }
    requireLogin();
  }

  // ----- 오디오 출력 (24kHz PCM16 = /api/tts 출력) -----
  let outCtx = null, playHead = 0;
  const activeSources = new Set();
  function ensureOutCtx() {
    if (!outCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      try { outCtx = new AC({ sampleRate: 24000 }); } catch (_) { outCtx = new AC(); }   // 샘플레이트 지정을 못 받는 브라우저는 기본값 (버퍼가 알아서 변환됨)
    }
    if (outCtx.state === 'suspended') outCtx.resume();
    return outCtx;
  }
  function playPcm(int16) {
    if (!outCtx || !int16.length) return;
    const f32 = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) f32[i] = int16[i] / 32768;
    const buf = outCtx.createBuffer(1, f32.length, 24000);
    buf.copyToChannel(f32, 0);
    const src = outCtx.createBufferSource();
    src.buffer = buf; src.connect(outCtx.destination);
    activeSources.add(src);
    src.onended = () => { activeSources.delete(src); refreshButtons(); };
    const now = outCtx.currentTime;
    if (playHead < now) playHead = now + 0.03;
    src.start(playHead); playHead += buf.duration;
    refreshButtons();
  }

  // ----- 문장 단위 TTS (스트리밍으로 받은 글자를 끊어서 /api/tts로) -----
  let tBuf = '', tGen = 0, tPending = 0, tSent = 0, tPrev = '', tChain = Promise.resolve(), tWarned = false;
  let onFirstAudio = null, tCarry = '';   // tCarry: 태그([sighs])만 있는 조각 - 읽을 글자가 없어 다음 조각 앞에 붙여 보낸다
  const tAborts = new Set();
  const MIN_FIRST = 8, MIN_NEXT = 70;   // 첫 조각은 짧게(첫 소리 빨리), 이후는 3~4문장씩(v3는 조각마다 따로 읽으므로 길수록 억양이 이어짐)
  // [sighs] 같은 감정 태그는 소리에만 쓰고 화면에서는 지운다 (스트리밍 중 덜 닫힌 '[...' 조각도 숨김)
  const stripTags = (t) => t.replace(/\[[^\[\]]{1,30}\]/g, ' ').replace(/\[[^\]]{0,30}$/, '').replace(/[ \t]+([.,!?…~])/g, '$1').replace(/[ \t]{2,}/g, ' ').replace(/^[ \t]+/, '');
  const clean = (t) => t.replace(/\p{Extended_Pictographic}|\uFE0F|\u200D/gu, '').replace(/[*_`#]+/g, '').replace(/\s+/g, ' ').trim();

  function ttsSpeak(raw) {
    if (!ttsAvailable) return;
    let text = clean(raw);
    if (!text || !/[\p{L}\p{N}]/u.test(text.replace(/\[[^\[\]]{0,30}\]/g, ''))) {
      if (text && /\[[^\[\]]{1,30}\]/.test(text)) tCarry = (tCarry + ' ' + text).trim();   // 태그만 있는 조각은 버리지 않고 다음 조각에 붙인다
      return;
    }
    if (tCarry) { text = tCarry + ' ' + text; tCarry = ''; }
    const gen = tGen, prev = tPrev; tPrev = text; tSent++;
    const ctrl = new AbortController(); tAborts.add(ctrl); tPending++;
    const p = fetch('/api/tts', {
      method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ text, previous_text: prev || undefined, voice_id: VOICE_ID || undefined, model_tags: modelTags || undefined }), signal: ctrl.signal
    }).then(async (res) => {
      if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || ('HTTP ' + res.status)); }
      const ab = await res.arrayBuffer();
      return new Int16Array(ab.slice(0, ab.byteLength - (ab.byteLength % 2)));
    });
    p.catch(() => {});
    tChain = tChain.then(async () => {
      try {
        const pcm = await p;
        if (gen !== tGen) return;
        if (onFirstAudio) { const f = onFirstAudio; onFirstAudio = null; f(); }
        playPcm(pcm);
      } catch (e) {
        if (gen === tGen && !(e && e.name === 'AbortError') && !tWarned) { tWarned = true; addSys('목소리 생성 실패: ' + (e && e.message ? e.message : e), true); }
      } finally { tAborts.delete(ctrl); if (gen === tGen) tPending = Math.max(0, tPending - 1); refreshButtons(); }
    });
  }
  function findCut(s) {
    const re = /[.!?~…。！？]+["'”’)\]]*(?=\s)|\n/g; let m;
    while ((m = re.exec(s))) {
      const end = m.index + m[0].length;
      if (s.slice(0, end).trim().length >= (tSent === 0 ? MIN_FIRST : MIN_NEXT)) return end;
    }
    if (tSent === 0) { const c = s.search(/[,，、](?=\s)/); if (c >= 14) return c + 1; }
    if (s.length > 160) { const sp = s.lastIndexOf(' ', 160); if (sp > 40) return sp; }
    return 0;
  }
  function ttsFeed(text) {
    tBuf += text;
    for (;;) { const cut = findCut(tBuf); if (cut <= 0) break; const piece = tBuf.slice(0, cut); if ((piece.match(/\[/g) || []).length !== (piece.match(/\]/g) || []).length) break; tBuf = tBuf.slice(cut); ttsSpeak(piece); }
  }
  // 필러('잠시만요.')는 MIN_FIRST(8자)보다 짧아서 ttsFeed에 넣으면 다음 대답 글자가 올 때까지 버퍼에 갇힌다 -> 바로 읽는다.
  // 읽은 뒤 tSent를 0으로 되돌려, 진짜 대답의 첫 조각이 MIN_NEXT(70자)가 아니라 MIN_FIRST(8자) 기준으로 끊기게 한다.
  function ttsFiller(text) { ttsSpeak(text); tSent = 0; }
  function ttsFlush() { const rest = tBuf; tBuf = ''; if (rest.trim()) ttsSpeak(rest); tSent = 0; tPrev = ''; tCarry = ''; }
  function stopAll() {
    tGen++; tBuf = ''; tCarry = ''; tPending = 0; tSent = 0; tPrev = ''; tChain = Promise.resolve(); onFirstAudio = null;
    tAborts.forEach((c) => { try { c.abort(); } catch (_) {} }); tAborts.clear();
    activeSources.forEach((s) => { try { s.stop(); } catch (_) {} }); activeSources.clear();
    playHead = outCtx ? outCtx.currentTime : 0;
    refreshButtons();
  }
  const isSpeaking = () => activeSources.size > 0 || tPending > 0;

  // ----- 한 턴 보내기 -----
  async function sendTurn(payload, userRow) {
    if (busy) return;
    busy = true; stopAll(); refreshButtons();
    const tid = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const ai = addRow('ai', '…', true);
    await ensureGeo();
    const t0 = performance.now();
    let reply = '', userText = payload.text || '', tFirstText = null, tFirstAudio = null, done = null, failed = false;
    onFirstAudio = () => { tFirstAudio = performance.now() - t0; renderStats(); };
    function renderStats() {
      const parts = [];
      if (tFirstText != null) parts.push('첫 글자 ' + sec(tFirstText));
      if (ttsAvailable) parts.push(tFirstAudio != null ? ('첫 소리 ' + sec(tFirstAudio)) : (done ? '소리 대기…' : ''));
      if (done) parts.push('완료 ' + sec(performance.now() - t0) + ' (서버 첫 토큰 ' + (done.firstMs != null ? done.firstMs + 'ms' : '-') + ', 준비 ' + done.prepMs + 'ms · ' + (done.model || '') + ')');
      ai.stats.textContent = parts.filter(Boolean).join(' · ');
    }
    function onEvent(ev) {
      if (ev.type === 'delta') {
        if (tFirstText == null) { tFirstText = performance.now() - t0; ai.bubble.classList.remove('pending'); ai.bubble.textContent = ''; }
        reply += ev.text; ai.bubble.textContent = stripTags(reply); scrollDown(); renderStats();
        if (ttsAvailable) { if (ev.filler) ttsFiller(ev.text); else ttsFeed(ev.text); }
      } else if (ev.type === 'user') {
        userText = ev.text || '';
        if (userRow) { userRow.bubble.classList.remove('pending'); userRow.bubble.textContent = userText || '(알아듣지 못했어요)'; }
      } else if (ev.type === 'done') {
        done = ev; if (ttsAvailable) ttsFlush(); renderStats();
        if (ev.warn) addSys(ev.warn, true);
        if (ev.searchOff && !searchOffNoted) { searchOffNoted = true; addSys('Google 검색 한도(쿼터)를 넘어서 지금은 검색 없이 답하고 있어요.'); }
      } else if (ev.type === 'error') {
        failed = true; if (ttsAvailable) ttsFlush();
        if (!reply) ai.row.remove();
        addSys('오류: ' + ev.message, true);
      }
    }
    try {
      const res = await fetch('/api/pipe/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ ...payload, turns: turns.slice(-30), ctx, sig, lat: geo.lat, lng: geo.lng, tid })
      });
      if (res.status === 401) { ai.row.remove(); requireLogin('로그인이 만료됐어요. 다시 로그인해주세요.'); return; }
      if (!res.ok || !res.body) { const d = await res.json().catch(() => ({})); throw new Error(d.error || ('HTTP ' + res.status)); }
      const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done: rd } = await reader.read();
        if (rd) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (line) { try { onEvent(JSON.parse(line)); } catch (_) {} } }
      }
      if (buf.trim()) { try { onEvent(JSON.parse(buf.trim())); } catch (_) {} }
      if (!done && !failed) { if (ttsAvailable) ttsFlush(); }
      if (reply && !failed) {
        turns.push({ role: 'user', text: userText || '(음성 메시지)' }, { role: 'model', text: reply });
        if (turns.length > MAX_TURNS_KEPT) turns = turns.slice(-MAX_TURNS_KEPT);
      }
    } catch (e) {
      if (ttsAvailable) ttsFlush();
      if (!reply) ai.row.remove();
      addSys('대답을 받지 못했어요: ' + (e && e.message ? e.message : e), true);
    } finally {
      busy = false; refreshButtons();
      if (!recording) txt.focus();
    }
  }

  function sendText() {
    const text = txt.value.trim();
    if (!text || busy || recording) return;
    ensureOutCtx(); txt.value = '';
    const u = addRow('user', text, false);
    sendTurn({ text }, u);
  }

  // ----- 음성 입력: 눌러서 녹음 시작 → 다시 누르면 16kHz WAV로 만들어 전송 -----
  let recording = null, recTimer = null;
  async function startRec() {
    if (busy || recording) return;
    ensureOutCtx(); stopAll();
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
    } catch (e) { addSys('마이크를 켤 수 없어요: ' + (e && e.message ? e.message : e), true); return; }
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    const proc = ac.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    proc.onaudioprocess = (e) => { chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
    src.connect(proc); proc.connect(ac.destination);   // 출력 버퍼는 비워두므로 소리는 나지 않는다
    recording = { stream, ac, src, proc, chunks, rate: ac.sampleRate, t0: performance.now() };
    micBtn.classList.add('rec');
    const upd = () => { micBtn.textContent = '● ' + ((performance.now() - recording.t0) / 1000).toFixed(1) + '초 · 눌러서 보내기'; };
    upd(); recTimer = setInterval(() => { if (!recording) return; upd(); if ((performance.now() - recording.t0) / 1000 >= MAX_REC_SEC) stopRec(true); }, 200);
    refreshButtons();
  }
  async function stopRec(send) {
    const r = recording; if (!r) return;
    recording = null; clearInterval(recTimer); recTimer = null;
    micBtn.classList.remove('rec'); micBtn.textContent = '🎤';
    try { r.proc.disconnect(); r.src.disconnect(); } catch (_) {}
    r.stream.getTracks().forEach((t) => t.stop());
    try { await r.ac.close(); } catch (_) {}
    refreshButtons();
    if (!send) return;
    let total = 0; r.chunks.forEach((c) => { total += c.length; });
    const f32 = new Float32Array(total); let off = 0; r.chunks.forEach((c) => { f32.set(c, off); off += c.length; });
    if (total / r.rate < 0.4) { addSys('너무 짧아서 보내지 않았어요.'); return; }
    const wav = encodeWav(downsample(f32, r.rate, 16000), 16000);
    const u = addRow('user', '🎤 …', true);
    sendTurn({ audio: toBase64(wav), mime: 'audio/wav' }, u);
  }
  function downsample(f32, inRate, outRate) {
    if (inRate === outRate) return f32;
    const ratio = inRate / outRate, n = Math.floor(f32.length / ratio), out = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const s = i * ratio, e = Math.min((i + 1) * ratio, f32.length); let sum = 0, c = 0;
      for (let j = Math.floor(s); j < Math.ceil(e); j++) { sum += f32[j]; c++; }
      out[i] = c ? sum / c : 0;
    }
    return out;
  }
  function encodeWav(f32, rate) {
    const buf = new ArrayBuffer(44 + f32.length * 2), v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + f32.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, f32.length * 2, true);
    for (let i = 0; i < f32.length; i++) { const s = Math.max(-1, Math.min(1, f32[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
    return new Uint8Array(buf);
  }
  function toBase64(bytes) {
    let bin = ''; const step = 0x8000;
    for (let i = 0; i < bytes.length; i += step) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    return btoa(bin);
  }

  function refreshButtons() {
    const live = !logEl.classList.contains('hidden');
    sendBtn.disabled = !live || busy || !!recording;
    micBtn.disabled = !live || (busy && !recording);
    stopBtn.disabled = !isSpeaking();
  }

  // ----- 시작 -----
  // 위치: 마지막으로 잡은 좌표를 geo에 두고, 없거나 오래됐으면 턴을 보내기 전에 다시 잡는다.
  //   geoStatus: 'unknown' | 'ok' | 'denied'(권한 거부) | 'unavailable'(기기/네트워크) | 'timeout' | 'insecure'(https 아님)
  let geoStatus = 'unknown', geoTs = 0, geoPromise = null, geoWarned = false;
  const GEO_FRESH_MS = 3 * 60 * 1000;
  function getPosition(timeoutMs, highAccuracy) {
    return new Promise((resolve) => {
      if (!window.isSecureContext) return resolve({ err: 'insecure' });
      if (!navigator.geolocation) return resolve({ err: 'unavailable' });
      navigator.geolocation.getCurrentPosition(
        (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
        (e) => resolve({ err: e && e.code === 1 ? 'denied' : (e && e.code === 3 ? 'timeout' : 'unavailable') }),
        { enableHighAccuracy: !!highAccuracy, timeout: timeoutMs, maximumAge: highAccuracy ? 0 : 120000 });
    });
  }
  function warnGeo() {
    if (geoWarned || geoStatus === 'ok' || geoStatus === 'unknown') return;
    geoWarned = true;
    const msg = {
      denied: '위치 권한이 꺼져 있어서 "근처 장소/길찾기"를 못 해요. 주소창 왼쪽 자물쇠(설정) → 위치 → 허용으로 바꾼 뒤 새로고침해주세요.',
      insecure: '위치는 https 주소에서만 쓸 수 있어요. (지금 주소가 http라서 위치를 못 받아요)',
      timeout: '위치를 잡는 데 시간이 너무 오래 걸려요. 폰의 위치(GPS)를 켜고 다시 말해보세요.',
      unavailable: '이 기기에서 위치를 가져오지 못했어요. 폰의 위치(GPS) 설정을 확인해주세요.',
    }[geoStatus];
    if (msg) addSys(msg, true);
  }
  function refreshGeo() {
    if (geoPromise) return geoPromise;
    geoPromise = (async () => {
      // 1차: 저정밀(빠름, 캐시 허용) 10초 -> 실패(타임아웃/불가)면 2차: 고정밀 15초. 권한 거부는 재시도 안 함.
      let r = await getPosition(10000, false);
      if (r.err === 'timeout' || r.err === 'unavailable') r = await getPosition(15000, true);
      if (r.err) { geoStatus = r.err; if (!geo.lat) geo = { lat: null, lng: null }; }
      else { geo = { lat: r.lat, lng: r.lng }; geoStatus = 'ok'; geoTs = Date.now(); geoWarned = false; }
      geoPromise = null;
      return geoStatus === 'ok';
    })();
    return geoPromise;
  }
  // 턴을 보내기 직전: 좌표가 없으면 최대 4초 기다려 보고, 오래됐으면 뒤에서 갱신만 한다.
  async function ensureGeo() {
    const fresh = geo.lat != null && (Date.now() - geoTs) < GEO_FRESH_MS;
    if (fresh) return;
    const p = refreshGeo();
    if (geo.lat == null && geoStatus !== 'denied' && geoStatus !== 'insecure') {
      await Promise.race([p, new Promise((r) => setTimeout(r, 4000))]);
    }
    if (geo.lat == null) warnGeo();
  }
  async function enter() {
    startBtn.disabled = true; startBtn.textContent = '연결 중…';
    ensureOutCtx();   // 사용자 클릭 안에서 오디오를 깨워둬야 나중에 소리가 난다
    refreshGeo().then(() => { if (geo.lat == null) warnGeo(); });   // 입장 때 권한 요청 (이후 턴마다 필요하면 다시 잡음)
    try {
      const res = await fetch('/api/pipe/start', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: '{}' });
      if (res.status === 401) { requireLogin('로그인이 필요해요.'); return; }
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || ('HTTP ' + res.status));
      ctx = d.ctx || ''; sig = d.sig || ''; modelTags = !!d.modelTags;
      ttsAvailable = !TTS_OFF && !!d.elevenKey && (!!d.elevenReady || !!VOICE_ID);
      $('meta').textContent = '모델 ' + d.model + ' · thinking ' + d.thinking + ' · 검색 ' + (d.search ? '켜짐' : '꺼짐') + ' · 이전 대화 ' + d.count + '건 · 감정태그 ' + (modelTags ? '본 모델' : '자동');
      setup.classList.add('hidden'); logEl.classList.remove('hidden'); bar.classList.remove('hidden');
      if (TTS_OFF) addSys('목소리 꺼짐(?tts=off) - 글자로만 답해요.');
      else if (!ttsAvailable) addSys('ElevenLabs 키/보이스 설정이 없어서 글자로만 답해요. (ELEVENLABS_API_KEY, ELEVENLABS_VOICE_ID 확인)', true);
      addSys('이전 대화를 이어서 말하는 상태예요. 글자를 보내거나 🎤를 눌러 말해보세요.');
      refreshButtons(); txt.focus();
    } catch (e) {
      startBtn.disabled = false; startBtn.textContent = '다시 시도';
      setupWarn.style.display = 'block'; setupWarn.textContent = '연결하지 못했어요: ' + (e && e.message ? e.message : e);
    }
  }

  startBtn.addEventListener('click', enter);
  sendBtn.addEventListener('click', sendText);
  txt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendText(); } });
  micBtn.addEventListener('click', () => { if (recording) stopRec(true); else startRec(); });
  stopBtn.addEventListener('click', stopAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden && recording) stopRec(false); });
  init();
})();
</script>
</body>
