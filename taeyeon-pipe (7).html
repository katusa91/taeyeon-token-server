<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>태연 — 파이프라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --plum-deep: #1c1220; --plum-mid: #2c1d33; --violet: #4a2f52;
    --gold: #cf9b4e; --gold-soft: #e8c78a; --rose: #c07b7f;
    --cream: #f1e7dc; --cream-dim: #b7a99a; --danger: #a85a4f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at 50% -10%, var(--plum-mid), var(--plum-deep) 60%);
    color: var(--cream);
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    overscroll-behavior: none;
  }
  .hidden { display: none !important; }
  #app {
    max-width: 480px; margin: 0 auto; height: 100dvh;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* Header */
  header { padding: 28px 24px 14px; text-align: center; border-bottom: 1px solid rgba(232,199,138,0.12); }
  header .moon {
    width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 10px;
    background: radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 55%, transparent 75%);
    box-shadow: 0 0 22px rgba(207,155,78,0.35);
  }
  header .eyebrow { font-size: 12px; letter-spacing: 0.02em; color: var(--cream-dim); margin: 0 0 6px; }
  header h1 { font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 600; margin: 0; color: var(--gold-soft); }
  #meta { font-size: 11px; color: var(--cream-dim); opacity: .8; margin-top: 8px; line-height: 1.5; white-space: pre-line; }

  /* Transcript */
  #log { flex: 1; overflow-y: auto; padding: 20px 20px 8px; display: flex; flex-direction: column; gap: 12px; }
  #log:empty::before {
    content: attr(data-empty); display: block; text-align: center; color: var(--cream-dim);
    font-size: 14px; margin-top: 40px;
  }
  .row { display: flex; flex-direction: column; max-width: 82%; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.ai { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 11px 15px; border-radius: 16px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .bubble.taeyeon { background: var(--violet); border-bottom-left-radius: 4px; color: var(--cream); }
  .bubble.me {
    background: rgba(207,155,78,0.16); border: 1px solid rgba(207,155,78,0.3);
    border-bottom-right-radius: 4px; color: var(--gold-soft);
  }
  .bubble.interim, .bubble.pending { opacity: 0.55; }
  .bubble.system { align-self: center; background: none; color: var(--cream-dim); font-size: 12.5px; padding: 4px 10px; text-align: center; max-width: 92%; }
  .bubble.system.err { color: var(--rose); }
  .bubble.me img.attached-photo { max-width: 200px; max-height: 200px; border-radius: 12px; display: block; object-fit: cover; }
  .bubble.me img.attached-photo + div { margin-top: 6px; }
  .stats { font-size: 10.5px; color: var(--cream-dim); opacity: .75; margin-top: 4px; padding: 0 4px; font-variant-numeric: tabular-nums; }

  /* 노래 재생 바 */
  #songBar { display: none; align-items: center; gap: 10px; margin: 0 16px 8px; padding: 8px 8px 8px 14px;
    border-radius: 14px; background: rgba(0,0,0,0.22); border: 1px solid rgba(232,199,138,0.22); }
  #songBar.on { display: flex; }
  #songBar .song-note { font-size: 16px; color: var(--gold-soft); animation: pulse 1.6s infinite; }
  #songBar .song-meta { min-width: 0; flex: 1; }
  #songBar .song-title { font-size: 13px; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #songBar .song-sub { font-size: 11px; color: var(--cream-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #songStopBtn { flex: 0 0 auto; width: 34px; height: 34px; border: 0; border-radius: 50%; cursor: pointer;
    background: rgba(232,199,138,0.14); color: var(--gold-soft); font-size: 13px; line-height: 1; }
  #songStopBtn:active { background: rgba(232,199,138,0.3); }

  /* Control deck */
  #deck {
    padding: 18px 24px calc(28px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    border-top: 1px solid rgba(232,199,138,0.12);
  }
  #status { font-size: 13px; color: var(--cream-dim); min-height: 18px; display: flex; align-items: center; gap: 6px; }
  #status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cream-dim); }
  #status.live .dot { background: #7fbf8f; box-shadow: 0 0 8px #7fbf8f; }
  #status.listening .dot { background: var(--gold-soft); box-shadow: 0 0 8px var(--gold-soft); animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  .iconBtn {
    margin-left: 4px; width: 24px; height: 24px; border-radius: 50%; border: none; background: transparent;
    color: var(--cream-dim); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    padding: 0; transition: color 0.15s ease, background 0.15s ease;
  }
  .iconBtn[hidden] { display: none; }
  .iconBtn:active { transform: scale(0.92); }
  .iconBtn svg { width: 15px; height: 15px; }
  #muteBtn.muted { color: var(--gold-soft); background: rgba(232,199,138,0.12); }
  #stopBtn { color: var(--gold-soft); background: rgba(232,199,138,0.12); }

  #orb-wrap { position: relative; width: 108px; height: 108px; }
  #orb {
    width: 100%; height: 100%; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 38% 32%, #5a3a63, var(--plum-mid) 70%);
    box-shadow: 0 0 0 1px rgba(232,199,138,0.25), 0 10px 30px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }
  #orb:disabled { opacity: .55; cursor: default; }
  #orb:active:not(:disabled) { transform: scale(0.96); }
  #orb.on {
    background: radial-gradient(circle at 38% 32%, var(--gold-soft), var(--gold) 60%, #7a4f2e 100%);
    box-shadow: 0 0 0 1px rgba(232,199,138,0.5), 0 0 40px rgba(207,155,78,0.45);
  }
  #orb-ring {
    position: absolute; inset: -10px; border-radius: 50%; border: 1px solid rgba(232,199,138,0.35);
    opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
  }
  #orb.on ~ #orb-ring, #orb-wrap.active #orb-ring { opacity: 1; animation: ring 1.6s ease-out infinite; }
  @keyframes ring { 0%{ transform: scale(0.9); opacity: 0.6; } 100%{ transform: scale(1.35); opacity: 0; } }
  #orb svg { width: 34px; height: 34px; }
  #hint { font-size: 12px; color: var(--cream-dim); text-align: center; }

  /* Text input row */
  #textRow { display: flex; align-items: center; gap: 8px; width: 100%; }
  #textInput {
    flex: 1; min-width: 0; padding: 11px 16px; border-radius: 999px;
    border: 1px solid rgba(232,199,138,0.25); background: rgba(0,0,0,0.25);
    color: var(--cream); font-size: 14px; font-family: inherit; outline: none;
  }
  #textInput:focus { border-color: var(--gold); }
  #textInput::placeholder { color: var(--cream-dim); }
  #textInput:disabled { opacity: 0.5; }
  #sendBtn {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: none;
    background: var(--gold); color: #2a1a10; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  #sendBtn:active { transform: scale(0.94); }
  #sendBtn:disabled { opacity: 0.35; cursor: default; }
  #sendBtn svg { width: 18px; height: 18px; }
  #attachBtn, #cameraBtn {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(232,199,138,0.3); background: rgba(232,199,138,0.1);
    color: var(--gold-soft); cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  #attachBtn:active, #cameraBtn:active { transform: scale(0.94); }
  #attachBtn:disabled, #cameraBtn:disabled { opacity: 0.35; cursor: default; }
  #attachBtn svg, #cameraBtn svg { width: 18px; height: 18px; }

  /* 첨부한 사진 미리보기 (아직 전송 전) */
  #imagePreviewRow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 2px 2px; }
  #imagePreviewThumbWrap { position: relative; flex: 0 0 auto; }
  #imagePreviewThumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; border: 1px solid rgba(232,199,138,0.3); display: block; }
  #imagePreviewRemove {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: none;
    background: var(--danger); color: var(--cream); font-size: 13px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  #imagePreviewHint { font-size: 12px; color: var(--cream-dim); }

  /* Setup overlay */
  #setup {
    position: fixed; inset: 0; background: rgba(12,7,14,0.92);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10;
  }
  #setup .card { background: var(--plum-mid); border: 1px solid rgba(232,199,138,0.18); border-radius: 18px; padding: 26px 22px; max-width: 380px; width: 100%; }
  #setup h2 { font-family: 'Noto Serif KR', serif; font-size: 18px; margin: 0 0 8px; color: var(--gold-soft); }
  #setup p { font-size: 13px; line-height: 1.6; color: var(--cream-dim); margin: 0 0 16px; }
  #setup button#startBtn {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: var(--gold); color: #2a1a10; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  #startBtn:disabled { opacity: .5; }
  #setup .warn { font-size: 11.5px; color: var(--rose); margin-top: 10px; line-height: 1.5; }
  #googleBtnWrap { display: flex; justify-content: center; margin-bottom: 4px; }

  /* 인앱 카메라 */
  #cameraModal { position: fixed; inset: 0; background: #000; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #cameraPreview { width: 100%; height: 100%; object-fit: cover; background: #000; }
  #cameraModalRow { position: absolute; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: center; gap: 28px; }
  #cameraShutterBtn { width: 68px; height: 68px; border-radius: 50%; border: 3px solid var(--cream); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  #cameraShutterBtn span { width: 54px; height: 54px; border-radius: 50%; background: var(--cream); display: block; }
  #cameraShutterBtn:active span { background: var(--gold-soft); }
  #cameraCancelBtn, #cameraSwitchBtn { border: none; background: rgba(0,0,0,0.4); color: var(--cream); cursor: pointer; border-radius: 999px; font-size: 13px; padding: 10px 16px; display: flex; align-items: center; justify-content: center; }
  #cameraSwitchBtn { width: 40px; height: 40px; padding: 0; border-radius: 50%; }
  #cameraSwitchBtn svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<div id="app">

  <div id="setup">
    <div class="card">
      <h2>시작하기 전에</h2>
      <p id="setupText">불러오는 중…</p>
      <div id="googleBtnWrap" class="hidden"></div>
      <button id="startBtn" style="display:none;">입장하기</button>
      <div class="warn" id="setupWarn" style="display:none;"></div>
    </div>
  </div>

  <header>
    <div class="moon"></div>
    <p class="eyebrow" id="personaTagline"></p>
    <h1 id="title">태연</h1>
    <div id="meta">파이프라인 모드 · Gemini Live 안 씀</div>
  </header>

  <div id="log" data-empty="마이크를 누르거나 글로 말을 걸어보세요"></div>

  <div id="songBar" role="status" aria-live="polite">
    <span class="song-note">♪</span>
    <div class="song-meta"><div class="song-title" id="songTitle"></div><div class="song-sub" id="songSub"></div></div>
    <button id="songStopBtn" type="button" aria-label="노래 멈추기" title="노래 멈추기">■</button>
  </div>

  <div id="deck">
    <div id="status">
      <span class="dot"></span><span id="statusText">연결 대기 중</span>
      <button id="muteBtn" class="iconBtn" type="button" aria-label="목소리 끄기" title="목소리 끄고 글자로만 보기">
        <svg id="muteIconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 9 7 9 12 4 12 20 7 15 3 15 3 9"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.3 6a9 9 0 0 1 0 12"></path>
        </svg>
        <svg id="muteIconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <polygon points="3 9 7 9 12 4 12 20 7 15 3 15 3 9"></polygon><line x1="16" y1="9" x2="21.5" y2="14.5"></line><line x1="21.5" y1="9" x2="16" y2="14.5"></line>
        </svg>
      </button>
      <button id="stopBtn" class="iconBtn" type="button" aria-label="목소리·노래 멈추기" title="목소리·노래 멈추기" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
      </button>
    </div>
    <div id="orb-wrap">
      <button id="orb" disabled aria-label="눌러서 말하기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:#e8c78a">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </button>
      <div id="orb-ring"></div>
    </div>
    <div id="hint">누르면 녹음 시작 · 다시 누르면 전송 · 글로 입력해도 <span id="hintName">태연</span>은 목소리로 답해요</div>
    <div id="imagePreviewRow" class="hidden">
      <div id="imagePreviewThumbWrap">
        <img id="imagePreviewThumb" alt="첨부한 사진" />
        <button id="imagePreviewRemove" type="button" aria-label="사진 제거">&times;</button>
      </div>
      <span id="imagePreviewHint">사진을 첨부했어요. 하고 싶은 말을 적고 보내보세요</span>
    </div>
    <div id="textRow">
      <input id="imageFileInput" type="file" accept="image/*" hidden />
      <input id="cameraFileInput" type="file" accept="image/*" capture="environment" hidden />
      <button id="attachBtn" type="button" disabled aria-label="사진 첨부">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button id="cameraBtn" type="button" disabled aria-label="사진 촬영">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <input id="textInput" type="text" inputmode="text" enterkeyhint="send" placeholder="글로 물어보기… (유튜브 링크도 붙여넣어 봐요)" disabled autocomplete="off" />
      <button id="sendBtn" disabled aria-label="보내기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <div id="cameraModal" class="hidden">
    <video id="cameraPreview" autoplay playsinline muted></video>
    <div id="cameraModalRow">
      <button id="cameraCancelBtn" type="button" aria-label="촬영 취소">취소</button>
      <button id="cameraShutterBtn" type="button" aria-label="촬영"><span></span></button>
      <button id="cameraSwitchBtn" type="button" aria-label="전후면 전환" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </div>
  </div>
</div>
<script>
(() => {
  'use strict';
  // ----- 설정 -----
  //  ?tts=off : 목소리 없이 글자만 (모델 속도만 따로 재볼 때)
  //  &vid=보이스ID : 서버의 ELEVENLABS_VOICE_ID 대신 이 보이스로 일시 변경
  const Q = new URLSearchParams(location.search);
  const TTS_OFF = Q.get('tts') === 'off';
  const VOICE_ID = (Q.get('vid') || '').trim();
  const AUTH_TOKEN_KEY = 'taeyeon_auth_token';   // 기존 웹앱과 같은 키 -> 거기서 로그인했으면 여기서도 유지됨
  const MAX_REC_SEC = 60;
  const MAX_TURNS_KEPT = 40;

  const $ = (id) => document.getElementById(id);
  const setup = $('setup'), setupText = $('setupText'), setupWarn = $('setupWarn');
  const startBtn = $('startBtn'), googleBtnWrap = $('googleBtnWrap');
  const logEl = $('log'), txt = $('textInput');
  const sendBtn = $('sendBtn'), orb = $('orb'), orbWrap = $('orb-wrap'), stopBtn = $('stopBtn');
  const statusEl = $('status'), statusText = $('statusText');
  const attachBtn = $('attachBtn'), cameraBtn = $('cameraBtn');
  const imageFileInput = $('imageFileInput'), cameraFileInput = $('cameraFileInput');
  const imagePreviewRow = $('imagePreviewRow'), imagePreviewThumb = $('imagePreviewThumb'), imagePreviewRemove = $('imagePreviewRemove');
  const muteBtn = $('muteBtn'), muteIconOn = $('muteIconOn'), muteIconOff = $('muteIconOff');
  const isMobileCaptureDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
    || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  const MUTE_KEY = 'taeyeon_voice_muted';       // 기존 웹앱과 같은 키 -> 거기서 정한 음소거 설정이 여기서도 유지됨
  let voiceMuted = false;
  try { voiceMuted = localStorage.getItem(MUTE_KEY) === '1'; } catch (_) {}
  let sessionOpen = false;           // 입장(시작하기)을 마쳐서 대화할 수 있는 상태

  let authToken = null;
  try { authToken = localStorage.getItem(AUTH_TOKEN_KEY); } catch (_) {}
  let googleClientId = '', personaName = '태연';
  const DEFAULT_TAGLINE = '연남동, 작은 타로샵';

  // 세션 상태
  let ctx = '', sig = '';            // 서버가 만든 '이번 접속 이전의 기억' 블록과 그 서명
  let turns = [];                    // 이번 접속 중 오간 대화 [{role:'user'|'model', text}]
  let geo = { lat: null, lng: null };
  let ttsAvailable = false;
  let searchOffNoted = false;        // '검색 한도 초과' 안내는 접속당 한 번만
  let modelTags = false;             // 서버가 '본 모델이 감정 태그를 직접 쓰는 모드'인지
  let busy = false;                  // 대답을 받아오는 중 (스트림이 끝나면 풀림)
  let silenced = false;              // ■를 눌러 이번 대답의 남은 목소리를 끈 상태 (다음 턴에 풀림)

  const authHeaders = () => (authToken ? { Authorization: 'Bearer ' + authToken } : {});

  // ----- 로그 UI (Live 화면과 같은 말풍선: 태연=왼쪽 보라, 나=오른쪽 금색, 안내=가운데 작은 글씨) -----
  function scrollDown() { logEl.scrollTop = logEl.scrollHeight; }
  function addSys(text, isErr) {
    const d = document.createElement('div');
    d.className = 'bubble system' + (isErr ? ' err' : '');
    d.textContent = text;
    logEl.appendChild(d); scrollDown();
    return d;
  }
  function addRow(who, text, pending, imageUrl) {
    const row = document.createElement('div'); row.className = 'row ' + who;
    const b = document.createElement('div'); b.className = 'bubble ' + (who === 'user' ? 'me' : 'taeyeon') + (pending ? ' pending' : '');
    if (imageUrl) {

  }
  function applyPersona(name, tagline) {
    personaName = String(name || '').trim() || '태연';
    const isDefault = personaName === '태연';
    const tag = String(tagline || '').trim() || (isDefault ? DEFAULT_TAGLINE : '');
    $('title').textContent = personaName; $('hintName').textContent = personaName;
    document.title = personaName + ' — 파이프라인';
    const tg = $('personaTagline'); tg.textContent = tag; tg.style.display = tag ? '' : 'none';
    logEl.dataset.empty = '마이크를 누르거나 ' + personaName + '에게 글로 말을 걸어보세요';
    applyMuteUI();
  }
  // 음소거: 대화와 글자는 그대로고 목소리만 안 낸다 (켜져 있는 동안은 TTS 요청도 보내지 않는다)
  function applyMuteUI() {

  muteBtn.addEventListener('click', () => {
    voiceMuted = !voiceMuted;
    try { localStorage.setItem(MUTE_KEY, voiceMuted ? '1' : '0'); } catch (_) {}
    if (outGain) outGain.gain.value = voiceMuted ? 0 : 1;

  });
  const sec = (ms) => (ms / 1000).toFixed(1) + '초';

  // ----- 로그인 (기존 웹앱과 동일한 흐름) -----
  function requireLogin(message) {
    authToken = null;
    try { localStorage.removeItem(AUTH_TOKEN_KEY); } catch (_) {}
    sessionOpen = false; setup.classList.remove('hidden');
    startBtn.style.display = 'none'; refreshButtons();
    setupText.textContent = message || '구글 계정으로 로그인해야 입장할 수 있어요.';

  }
  function renderGoogleButton() {

    googleBtnWrap.classList.remove('hidden'); googleBtnWrap.innerHTML = '';
    google.accounts.id.initialize({ client_id: googleClientId, callback: onGoogleCredential });
    google.accounts.id.renderButton(googleBtnWrap, { theme: 'filled_black', size: 'large', shape: 'pill', text: 'continue_with', locale: 'ko' });
  }
  async function onGoogleCredential(resp) {
    googleBtnWrap.classList.add('hidden'); setupText.textContent = '로그인 확인 중…';
    try {
      const res = await fetch('/api/auth/google', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: resp.credential }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.sessionToken) { setupText.textContent = '허용되지 않은 구글 계정이에요.'; renderGoogleButton(); return; }
      authToken = data.sessionToken;
      try { localStorage.setItem(AUTH_TOKEN_KEY, authToken); } catch (_) {}
      showStart();
    } catch (_) { setupText.textContent = '로그인 확인에 실패했어요. 네트워크를 확인해주세요.'; renderGoogleButton(); }
  }
  function showStart() {
    googleBtnWrap.classList.add('hidden');
    setupText.textContent = personaName + '과 대화를 시작해요. (글자 입력 또는 마이크를 눌러 말하기)';
    startBtn.style.display = 'inline-block'; startBtn.disabled = false;
  }

  async function init() {
    let authRequired = false;
    try {
      const data = await (await fetch('/api/config')).json();
      authRequired = !!data.authRequired; googleClientId = data.googleClientId || '';
      applyPersona(data.personaName, data.personaTagline);
    } catch (_) { /* 설정 조회 실패 시 로그인 없이 진행 - 실제 실패는 시작 단계에서 드러남 */ }
    if (!authRequired || authToken) { showStart(); return; }
    requireLogin();
  }

  // ----- 오디오 출력 (24kHz PCM16 = /api/tts 출력) -----
  let outCtx = null, outGain = null, playHead = 0;
  const activeSources = new Set();
  function ensureOutCtx() {
    if (!outCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      try { outCtx = new AC({ sampleRate: 24000 }); } catch (_) { outCtx = new AC(); }   // 샘플레이트 지정을 못 받는 브라우저는 기본값 (버퍼가 알아서 변환됨)
      outGain = outCtx.createGain(); outGain.gain.value = voiceMuted ? 0 : 1; outGain.connect(outCtx.destination);
    }
    if (outCtx.state === 'suspended') outCtx.resume();
    return outCtx;
  }
  function playPcm(int16) {
    if (!outCtx || !int16.length) return;
    const f32 = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) f32[i] = int16[i] / 32768;
    const buf = outCtx.createBuffer(1, f32.length, 24000);
    buf.copyToChannel(f32, 0);
    const src = outCtx.createBufferSource();
    src.buffer = buf; src.connect(outGain);
    activeSources.add(src);
    src.onended = () => { activeSources.delete(src); refreshButtons(); };
    const now = outCtx.currentTime;
    if (playHead < now) playHead = now + 0.03;
    src.start(playHead); playHead += buf.duration;
    refreshButtons();
  }

  // ----- 문장 단위 TTS (스트리밍으로 받은 글자를 끊어서 /api/tts로) -----
  let tBuf = '', tGen = 0, tPending = 0, tSent = 0, tPrev = '', tChain = Promise.resolve(), tWarned = false;
  let onFirstAudio = null, tCarry = '';   // tCarry: 태그([sighs])만 있는 조각 - 읽을 글자가 없어 다음 조각 앞에 붙여 보낸다
  const tAborts = new Set();
  const MIN_FIRST = 8, MIN_NEXT = 70;   // 첫 조각은 짧게(첫 소리 빨리), 이후는 3~4문장씩(v3는 조각마다 따로 읽으므로 길수록 억양이 이어짐)
  // [sighs] 같은 감정 태그는 소리에만 쓰고 화면에서는 지운다 (스트리밍 중 덜 닫힌 '[...' 조각도 숨김)
  const stripTags = (t) => t.replace(/\[[^\[\]]{1,30}\]/g, ' ').replace(/\[[^\]]{0,30}$/, '').replace(/[ \t]+([.,!?…~])/g, '$1').replace(/[ \t]{2,}/g, ' ').replace(/^[ \t]+/, '');
  const clean = (t) => t.replace(/\p{Extended_Pictographic}|\uFE0F|\u200D/gu, '').replace(/[*_`#]+/g, '').replace(/\s+/g, ' ').trim();

  function ttsSpeak(raw) {
    if (!ttsAvailable || voiceMuted || silenced) return;
    let text = clean(raw);
    if (!text || !/[\p{L}\p{N}]/u.test(text.replace(/\[[^\[\]]{0,30}\]/g, ''))) {
      if (text && /\[[^\[\]]{1,30}\]/.test(text)) tCarry = (tCarry + ' ' + text).trim();   // 태그만 있는 조각은 버리지 않고 다음 조각에 붙인다
      return;
    }
    if (tCarry) { text = tCarry + ' ' + text; tCarry = ''; }
    const gen = tGen, prev = tPrev; tPrev = text; tSent++;
    const ctrl = new AbortController(); tAborts.add(ctrl); tPending++;
    const p = fetch('/api/tts', {
      method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ text, previous_text: prev || undefined, voice_id: VOICE_ID || undefined, model_tags: modelTags || undefined }), signal: ctrl.signal
    }).then(async (res) => {
      if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || ('HTTP ' + res.status)); }
      const ab = await res.arrayBuffer();
      return new Int16Array(ab.slice(0, ab.byteLength - (ab.byteLength % 2)));
    });
    p.catch(() => {});
    tChain = tChain.then(async () => {
      try {
        const pcm = await p;
        if (gen !== tGen) return;
        if (onFirstAudio) { const f = onFirstAudio; onFirstAudio = null; f(); }
        playPcm(pcm);
      } catch (e) {
        if (gen === tGen && !(e && e.name === 'AbortError') && !tWarned) { tWarned = true; addSys('목소리 생성 실패: ' + (e && e.message ? e.message : e), true); }
      } finally { tAborts.delete(ctrl); if (gen === tGen) tPending = Math.max(0, tPending - 1); refreshButtons(); }
    });
  }
  function findCut(s) {
    const re = /[.!?~…。！？]+["'”’)\]]*(?=\s)|\n/g; let m;
    while ((m = re.exec(s))) {
      const end = m.index + m[0].length;
      if (s.slice(0, end).trim().length >= (tSent === 0 ? MIN_FIRST : MIN_NEXT)) return end;
    }
    if (tSent === 0) { const c = s.search(/[,，、](?=\s)/); if (c >= 14) return c + 1; }
    if (s.length > 160) { const sp = s.lastIndexOf(' ', 160); if (sp > 40) return sp; }
    return 0;
  }
  function ttsFeed(text) {
    tBuf += text;
    for (;;) { const cut = findCut(tBuf); if (cut <= 0) break; const piece = tBuf.slice(0, cut); if ((piece.match(/\[/g) || []).length !== (piece.match(/\]/g) || []).length) break; tBuf = tBuf.slice(cut); ttsSpeak(piece); }
  }
  // 필러('잠시만요.')는 MIN_FIRST(8자)보다 짧아서 ttsFeed에 넣으면 다음 대답 글자가 올 때까지 버퍼에 갇힌다 -> 바로 읽는다.
  // 읽은 뒤 tSent를 0으로 되돌려, 진짜 대답의 첫 조각이 MIN_NEXT(70자)가 아니라 MIN_FIRST(8자) 기준으로 끊기게 한다.
  // 대답이 중간에 끊겨 이어받는 경우: 버퍼에 남은 앞부분(끊긴 조각)을 먼저 읽고 나서 필러를 읽는다.
  function ttsFiller(text) { const rest = tBuf; tBuf = ''; if (rest.trim()) ttsSpeak(rest); ttsSpeak(text); tSent = 0; }
  function ttsFlush() { const rest = tBuf; tBuf = ''; if (rest.trim()) ttsSpeak(rest); tSent = 0; tPrev = ''; tCarry = ''; }
  function stopAll() {
    tGen++; tBuf = ''; tCarry = ''; tPending = 0; tSent = 0; tPrev = ''; tChain = Promise.resolve(); onFirstAudio = null;
    tAborts.forEach((c) => { try { c.abort(); } catch (_) {} }); tAborts.clear();
    activeSources.forEach((s) => { try { s.stop(); } catch (_) {} }); activeSources.clear();
    playHead = outCtx ? outCtx.currentTime : 0;
    refreshButtons();
  }
  const isSpeaking = () => activeSources.size > 0 || tPending > 0;

  // ----- 노래 재생 (서버가 보내는 {type:'song', play:{url,title,artist,mood}} 이벤트) -----
  // 서버는 대답 중 play_song 함수가 불리면 곡 주소를 이 이벤트로 보낸다. 태연의 안내 음성이 다 끝난 뒤에 재생한다.
  const SONG_VOLUME = 0.8, SONG_DUCK_VOLUME = 0.25, SONG_WAIT_MAX_MS = 90000;
  const songAudio = new Audio(); songAudio.preload = 'auto';
  let songNow = null, songPending = null, songWaitTimer = null, songUnlocked = false;
  function songUnlock() {   // 사용자 터치 안에서 한 번 - 나중에 타이머로 시작하는 재생이 브라우저 자동재생 제한에 막히지 않게 한다
    if (songUnlocked) return; songUnlocked = true;
    try {
      songAudio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
      const p = songAudio.play(); if (p && p.catch) p.catch(() => {});
      songAudio.pause();
    } catch (_) {}
  }
  document.addEventListener('pointerdown', songUnlock, { once: true, passive: true });
  const songBarEl = $('songBar');
  function showSongBar(play) {
    $('songTitle').textContent = play.title || '(제목 없음)';
    $('songSub').textContent = [play.artist, play.mood].filter(Boolean).join(' · ');
    songBarEl.classList.add('on');
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: play.title || '', artist: play.artist || '' });
        navigator.mediaSession.setActionHandler('pause', () => stopSong());
        navigator.mediaSession.setActionHandler('stop', () => stopSong());
      } catch (_) {}
    }
  }
  function cancelPendingSong() { if (songWaitTimer) { clearInterval(songWaitTimer); songWaitTimer = null; } songPending = null; }
  function stopSong() {
    cancelPendingSong();
    const was = !!songNow;
    songNow = null;
    try { songAudio.pause(); } catch (_) {}
    songBarEl.classList.remove('on');
    refreshButtons();
    return was;
  }
  songAudio.addEventListener('ended', () => { if (songNow) stopSong(); });
  songAudio.addEventListener('error', () => {
    if (!songNow) return;
    console.warn('노래 재생 오류:', songAudio.error);
    stopSong(); addSys('노래 파일을 재생하지 못했어요.', true);
  });
  $('songStopBtn').addEventListener('click', stopSong);
  function startSong(play) {
    if (songNow) { try { songAudio.pause(); } catch (_) {} songNow = null; }
    songAudio.src = play.url; songAudio.volume = SONG_VOLUME;
    songNow = play; showSongBar(play); refreshButtons();
    songAudio.play().then(() => {
      addSys('🎵 ' + (play.artist ? play.artist + ' - ' : '') + (play.title || ''));
    }).catch((e) => {
      console.warn('노래 재생 시작 실패:', e);
      if (songNow === play) { songNow = null; songBarEl.classList.remove('on'); refreshButtons(); }
      addSys('노래를 재생하지 못했어요. 화면을 한 번 터치한 뒤 다시 말해주세요.', true);
    });
  }
  // 대답 스트림이 끝나고 태연의 목소리 재생도 끝나면 cb 실행 (목소리가 아예 없거나 너무 오래 걸려도 timeoutMs 뒤엔 실행)
  function whenVoiceDone(cb, timeoutMs) {
    const t0 = Date.now(); let quiet = 0;
    const iv = setInterval(() => {
      if (busy || isSpeaking()) quiet = 0; else quiet++;
      if (quiet >= 2 || Date.now() - t0 > timeoutMs) { clearInterval(iv); cb(); }
    }, 150);
    return iv;
  }
  function playSongAfterVoice(play) {
    cancelPendingSong();
    songPending = play;
    songWaitTimer = whenVoiceDone(() => {
      songWaitTimer = null;
      if (songPending !== play) return;
      songPending = null; startSong(play);
    }, SONG_WAIT_MAX_MS);
  }
  function duckSong() { if (songNow) songAudio.volume = SONG_DUCK_VOLUME; }     // 태연이 말하는 동안 곡 소리를 줄인다
  function restoreSongVolume() { whenVoiceDone(() => { if (songNow && !songPending) songAudio.volume = SONG_VOLUME; }, SONG_WAIT_MAX_MS); }

  // ----- 한 턴 보내기 -----
  async function sendTurn(payload, userRow) {
    if (busy) return;
    busy = true; silenced = false; cancelPendingSong(); duckSong(); stopAll(); refreshButtons();
    const tid = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const ai = addRow('ai', '…', true);
    await ensureGeo();
    const t0 = performance.now();
    let reply = '', userText = payload.text || (payload.image ? '(사진을 보냈어요)' : ''), tFirstText = null, tFirstAudio = null, done = null, failed = false;
    onFirstAudio = () => { tFirstAudio = performance.now() - t0; renderStats(); };
    function renderStats() {
      const parts = [];
      if (tFirstText != null) parts.push('첫 글자 ' + sec(tFirstText));
      if (ttsAvailable && !voiceMuted) parts.push(tFirstAudio != null ? ('첫 소리 ' + sec(tFirstAudio)) : (done ? '소리 대기…' : ''));
      if (done) parts.push('완료 ' + sec(performance.now() - t0) + ' (서버 첫 토큰 ' + (done.firstMs != null ? done.firstMs + 'ms' : '-') + ', 준비 ' + done.prepMs + 'ms · ' + (done.model || '') + ')');
      ai.stats.textContent = parts.filter(Boolean).join(' · ');
    }
    function onEvent(ev) {
      if (ev.type === 'delta') {
        if (tFirstText == null) { tFirstText = performance.now() - t0; ai.bubble.classList.remove('pending'); ai.bubble.textContent = ''; }
        reply += ev.text; ai.bubble.textContent = stripTags(reply); scrollDown(); renderStats();
        if (ttsAvailable) { if (ev.filler) ttsFiller(ev.text); else ttsFeed(ev.text); }
      } else if (ev.type === 'song') {
        if (ev.play && ev.play.url) playSongAfterVoice(ev.play);
      } else if (ev.type === 'stop') {
        stopSong();      // '그만' - 노래도 멈춘다 (안내 한마디 음성은 그대로 읽는다)
      } else if (ev.type === 'user') {
        userText = ev.text || '';
        if (userRow) { userRow.bubble.classList.remove('pending'); if (!payload.image) userRow.bubble.textContent = userText || '(알아듣지 못했어요)'; }
      } else if (ev.type === 'done') {
        done = ev; if (ttsAvailable) ttsFlush(); renderStats();
        if (ev.warn) addSys(ev.warn, true);
        if (ev.searchOff && !searchOffNoted) { searchOffNoted = true; addSys('Google 검색 한도(쿼터)를 넘어서 지금은 검색 없이 답하고 있어요.'); }
      } else if (ev.type === 'error') {
        failed = true; if (ttsAvailable) ttsFlush();
        if (!reply) ai.row.remove();
        addSys('오류: ' + ev.message, true);
      }
    }
    try {
      const res = await fetch('/api/pipe/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ ...payload, turns: turns.slice(-30), ctx, sig, lat: geo.lat, lng: geo.lng, tid })
      });
      if (res.status === 401) { ai.row.remove(); requireLogin('로그인이 만료됐어요. 다시 로그인해주세요.'); return; }
      if (!res.ok || !res.body) { const d = await res.json().catch(() => ({})); throw new Error(d.error || ('HTTP ' + res.status)); }
      const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done: rd } = await reader.read();
        if (rd) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (line) { try { onEvent(JSON.parse(line)); } catch (_) {} } }
      }
      if (buf.trim()) { try { onEvent(JSON.parse(buf.trim())); } catch (_) {} }
      if (!done && !failed) { if (ttsAvailable) ttsFlush(); }
      if (reply && !failed) {
        turns.push({ role: 'user', text: userText || '(음성 메시지)' }, { role: 'model', text: reply });
        if (turns.length > MAX_TURNS_KEPT) turns = turns.slice(-MAX_TURNS_KEPT);
      }
    } catch (e) {
      if (ttsAvailable) ttsFlush();
      if (!reply) ai.row.remove();
      addSys('대답을 받지 못했어요: ' + (e && e.message ? e.message : e), true);
    } finally {
      busy = false; refreshButtons();
      if (songNow && !songPending) restoreSongVolume();
      if (!recording && !payload.audio) txt.focus();
    }
  }

  function sendText() {
    const text = txt.value.trim(), image = pendingImage;
    if ((!text && !image) || busy || recording || !sessionOpen) return;
    ensureOutCtx(); songUnlock(); txt.value = '';
    clearPendingImage();
    const u = addRow('user', text, false, image ? image.previewUrl : null);
    sendTurn(image ? { text, image: image.base64, image_mime: image.mimeType } : { text }, u);
  }

  // ----- 사진 첨부 / 인앱 카메라 (Live 화면과 같은 방식) -----
  const IMAGE_MAX_DIM = 1280, IMAGE_JPEG_QUALITY = 0.82;
  let pendingImage = null;   // { base64, mimeType, previewUrl } - 아직 전송 전, 미리보기에 떠 있는 사진
  function clearPendingImage() { pendingImage = null; imagePreviewThumb.src = ''; imagePreviewRow.classList.add('hidden'); }
  function resizeImageFile(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(reader.error || new Error('파일을 읽지 못했어요'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('사진을 읽지 못했어요'));
        img.onload = () => {
          let { width, height } = img;
          if (width <= 0 || height <= 0) { reject(new Error('사진 크기를 확인하지 못했어요')); return; }
          if (width > maxDim || height > maxDim) {
            const scale = Math.min(maxDim / width, maxDim / height);
            width = Math.max(1, Math.round(width * scale)); height = Math.max(1, Math.round(height * scale));
          }
          const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          const base64 = dataUrl.split(',')[1] || '';
          if (!base64) { reject(new Error('사진을 변환하지 못했어요')); return; }
          resolve({ base64, mimeType: 'image/jpeg', previewUrl: dataUrl });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  async function handlePickedImageFile(file) {
    if (!file) return;
    if (!file.type || !file.type.startsWith('image/')) { addSys('사진 파일만 첨부할 수 있어요.'); return; }
    try {
      pendingImage = await resizeImageFile(file, IMAGE_MAX_DIM, IMAGE_JPEG_QUALITY);
      imagePreviewThumb.src = pendingImage.previewUrl; imagePreviewRow.classList.remove('hidden'); txt.focus();
      refreshButtons();
    } catch (e) { console.warn('사진 처리 실패:', e); addSys('사진을 처리하지 못했어요. 다른 사진으로 시도해주세요.', true); }
  }
  attachBtn.addEventListener('click', () => { if (!sessionOpen) return; imageFileInput.click(); });
  imageFileInput.addEventListener('change', async () => { const f = imageFileInput.files && imageFileInput.files[0]; imageFileInput.value = ''; await handlePickedImageFile(f); });
  cameraFileInput.addEventListener('change', async () => { const f = cameraFileInput.files && cameraFileInput.files[0]; cameraFileInput.value = ''; await handlePickedImageFile(f); });
  imagePreviewRemove.addEventListener('click', () => { clearPendingImage(); refreshButtons(); });

  const cameraModal = $('cameraModal'), cameraPreview = $('cameraPreview');
  const cameraCancelBtn = $('cameraCancelBtn'), cameraShutterBtn = $('cameraShutterBtn'), cameraSwitchBtn = $('cameraSwitchBtn');
  let cameraStream = null, cameraFacingMode = 'environment';
  function closeCameraModal() {
    cameraModal.classList.add('hidden');
    if (cameraStream) { cameraStream.getTracks().forEach((t) => t.stop()); cameraStream = null; }
    cameraPreview.srcObject = null;
  }
  async function openCameraModal() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { cameraFileInput.click(); return; }
    try { cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: cameraFacingMode } }, audio: false }); }
    catch (e) { console.warn('인앱 카메라 열기 실패 - 기본 파일선택으로 대체:', e); cameraFileInput.click(); return; }
    cameraPreview.srcObject = cameraStream; cameraModal.classList.remove('hidden');
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      cameraSwitchBtn.style.display = devices.filter((d) => d.kind === 'videoinput').length > 1 ? '' : 'none';
    } catch (_) {}
  }
  cameraCancelBtn.addEventListener('click', closeCameraModal);
  cameraSwitchBtn.addEventListener('click', async () => {
    cameraFacingMode = cameraFacingMode === 'environment' ? 'user' : 'environment';
    if (cameraStream) cameraStream.getTracks().forEach((t) => t.stop());
    try { cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: cameraFacingMode } }, audio: false }); cameraPreview.srcObject = cameraStream; }
    catch (e) { console.warn('카메라 전환 실패:', e); addSys('반대쪽 카메라를 열지 못했어요.'); }
  });
  cameraShutterBtn.addEventListener('click', () => {
    const v = cameraPreview, canvas = document.createElement('canvas');
    canvas.width = v.videoWidth || 1280; canvas.height = v.videoHeight || 960;
    canvas.getContext('2d').drawImage(v, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(async (blob) => {
      closeCameraModal();
      if (!blob) { addSys('사진을 처리하지 못했어요.', true); return; }
      await handlePickedImageFile(blob);
    }, 'image/jpeg', 0.92);
  });
  cameraBtn.addEventListener('click', () => { if (sessionOpen && isMobileCaptureDevice) openCameraModal(); });

  // ----- 음성 입력: 눌러서 녹음 시작 → 다시 누르면 16kHz WAV로 만들어 전송 -----
  let recording = null, recTimer = null;
  async function startRec() {
    if (busy || recording) return;
    if (!sessionOpen) return;
    ensureOutCtx(); songUnlock(); stopAll(); stopSong();
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
    } catch (e) { addSys('마이크를 켤 수 없어요: ' + (e && e.message ? e.message : e), true); return; }
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    const proc = ac.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    proc.onaudioprocess = (e) => { chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
    src.connect(proc); proc.connect(ac.destination);   // 출력 버퍼는 비워두므로 소리는 나지 않는다
    recording = { stream, ac, src, proc, chunks, rate: ac.sampleRate, t0: performance.now() };
    recTimer = setInterval(() => { if (!recording) return; updateStatus(); if ((performance.now() - recording.t0) / 1000 >= MAX_REC_SEC) stopRec(true); }, 200);
    refreshButtons();
  }
  async function stopRec(send) {
    const r = recording; if (!r) return;
    recording = null; clearInterval(recTimer); recTimer = null;
    try { r.proc.disconnect(); r.src.disconnect(); } catch (_) {}
    r.stream.getTracks().forEach((t) => t.stop());
    try { await r.ac.close(); } catch (_) {}
    refreshButtons();
    if (!send) return;
    let total = 0; r.chunks.forEach((c) => { total += c.length; });
    const f32 = new Float32Array(total); let off = 0; r.chunks.forEach((c) => { f32.set(c, off); off += c.length; });
    if (total / r.rate < 0.4) { addSys('너무 짧아서 보내지 않았어요.'); return; }
    const wav = encodeWav(downsample(f32, r.rate, 16000), 16000);
    const u = addRow('user', '🎤 …', true);
    sendTurn({ audio: toBase64(wav), mime: 'audio/wav' }, u);
  }
  function downsample(f32, inRate, outRate) {
    if (inRate === outRate) return f32;
    const ratio = inRate / outRate, n = Math.floor(f32.length / ratio), out = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const s = i * ratio, e = Math.min((i + 1) * ratio, f32.length); let sum = 0, c = 0;
      for (let j = Math.floor(s); j < Math.ceil(e); j++) { sum += f32[j]; c++; }
      out[i] = c ? sum / c : 0;
    }
    return out;
  }
  function encodeWav(f32, rate) {
    const buf = new ArrayBuffer(44 + f32.length * 2), v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + f32.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, f32.length * 2, true);
    for (let i = 0; i < f32.length; i++) { const s = Math.max(-1, Math.min(1, f32[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
    return new Uint8Array(buf);
  }
  function toBase64(bytes) {
    let bin = ''; const step = 0x8000;
    for (let i = 0; i < bytes.length; i += step) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    return btoa(bin);
  }

  function updateStatus() {
    let mode = 'live', text;
    if (!sessionOpen) { mode = ''; text = '연결 대기 중'; }
    else if (recording) { mode = 'listening'; text = '듣는 중 · ' + ((performance.now() - recording.t0) / 1000).toFixed(1) + '초 · 다시 누르면 보내기'; }
    else if (isSpeaking()) text = '말하는 중 · 누르면 멈추고 말하기';
    else if (busy) text = '생각하는 중…';
    else if (songNow) text = '🎵 노래 재생 중';
    else text = '대기 중 · 눌러서 말하기';
    statusEl.className = mode; statusText.textContent = text;
    orb.classList.toggle('on', !!recording);
    orbWrap.classList.toggle('active', !recording && (busy || isSpeaking()));
  }
  function refreshButtons() {
    const live = sessionOpen;
    sendBtn.disabled = !live || busy || !!recording;
    orb.disabled = !live || (busy && !recording);
    txt.disabled = !live;
    attachBtn.disabled = !live;
    cameraBtn.disabled = !live || !isMobileCaptureDevice;
    if (!isMobileCaptureDevice) cameraBtn.title = '카메라 촬영은 모바일에서만 지원돼요';
    stopBtn.hidden = !(isSpeaking() || songNow || songPending || (busy && ttsAvailable && !voiceMuted));
    updateStatus();
  }

  // ----- 시작 -----
  // 위치: 마지막으로 잡은 좌표를 geo에 두고, 없거나 오래됐으면 턴을 보내기 전에 다시 잡는다.
  //   geoStatus: 'unknown' | 'ok' | 'denied'(권한 거부) | 'unavailable'(기기/네트워크) | 'timeout' | 'insecure'(https 아님)
  let geoStatus = 'unknown', geoTs = 0, geoPromise = null, geoWarned = false;
  const GEO_FRESH_MS = 3 * 60 * 1000;
  function getPosition(timeoutMs, highAccuracy) {
    return new Promise((resolve) => {
      if (!window.isSecureContext) return resolve({ err: 'insecure' });
      if (!navigator.geolocation) return resolve({ err: 'unavailable' });
      navigator.geolocation.getCurrentPosition(
        (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
        (e) => resolve({ err: e && e.code === 1 ? 'denied' : (e && e.code === 3 ? 'timeout' : 'unavailable') }),
        { enableHighAccuracy: !!highAccuracy, timeout: timeoutMs, maximumAge: highAccuracy ? 0 : 120000 });
    });
  }
  function warnGeo() {
    if (geoWarned || geoStatus === 'ok' || geoStatus === 'unknown') return;
    geoWarned = true;
    const msg = {
      denied: '위치 권한이 꺼져 있어서 "근처 장소/길찾기"를 못 해요. 주소창 왼쪽 자물쇠(설정) → 위치 → 허용으로 바꾼 뒤 새로고침해주세요.',
      insecure: '위치는 https 주소에서만 쓸 수 있어요. (지금 주소가 http라서 위치를 못 받아요)',
      timeout: '위치를 잡는 데 시간이 너무 오래 걸려요. 폰의 위치(GPS)를 켜고 다시 말해보세요.',
      unavailable: '이 기기에서 위치를 가져오지 못했어요. 폰의 위치(GPS) 설정을 확인해주세요.',
    }[geoStatus];
    if (msg) addSys(msg, true);
  }
  function refreshGeo() {
    if (geoPromise) return geoPromise;
    geoPromise = (async () => {
      // 1차: 저정밀(빠름, 캐시 허용) 10초 -> 실패(타임아웃/불가)면 2차: 고정밀 15초. 권한 거부는 재시도 안 함.
      let r = await getPosition(10000, false);
      if (r.err === 'timeout' || r.err === 'unavailable') r = await getPosition(15000, true);
      if (r.err) { geoStatus = r.err; if (!geo.lat) geo = { lat: null, lng: null }; }
      else { geo = { lat: r.lat, lng: r.lng }; geoStatus = 'ok'; geoTs = Date.now(); geoWarned = false; }
      geoPromise = null;
      return geoStatus === 'ok';
    })();
    return geoPromise;
  }
  // 턴을 보내기 직전: 좌표가 없으면 최대 4초 기다려 보고, 오래됐으면 뒤에서 갱신만 한다.
  async function ensureGeo() {
    const fresh = geo.lat != null && (Date.now() - geoTs) < GEO_FRESH_MS;
    if (fresh) return;
    const p = refreshGeo();
    if (geo.lat == null && geoStatus !== 'denied' && geoStatus !== 'insecure') {
      await Promise.race([p, new Promise((r) => setTimeout(r, 4000))]);
    }
    if (geo.lat == null) warnGeo();
  }
  async function enter() {
    startBtn.disabled = true; startBtn.textContent = '연결 중…';
    ensureOutCtx(); songUnlock();   // 사용자 클릭 안에서 오디오를 깨워둬야 나중에 소리가 난다
    refreshGeo().then(() => { if (geo.lat == null) warnGeo(); });   // 입장 때 권한 요청 (이후 턴마다 필요하면 다시 잡음)
    try {
      const res = await fetch('/api/pipe/start', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: '{}' });
      if (res.status === 401) { requireLogin('로그인이 필요해요.'); return; }
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || ('HTTP ' + res.status));
      ctx = d.ctx || ''; sig = d.sig || ''; modelTags = !!d.modelTags;
      ttsAvailable = !TTS_OFF && !!d.elevenKey && (!!d.elevenReady || !!VOICE_ID);
      $('meta').textContent = '파이프라인 · 모델 ' + d.model + ' · thinking ' + d.thinking + ' · 검색 ' + (d.search ? '켜짐' : '꺼짐') + ' · 이전 대화 ' + d.count + '건 · 감정태그 ' + (modelTags ? '본 모델' : '자동');
      // 둘째 줄: 지금 목소리를 어떤 TTS로 읽는지 (서버 설정 기준. ?vid= 로 보이스를 바꿨으면 그 보이스 표시)
      const ttsLine = TTS_OFF ? '소리 꺼짐 (?tts=off)'
        : (!d.ttsProvider ? '없음 (TTS 설정이 비어 있어요)'
          : d.ttsProvider + (d.ttsModel ? ' · ' + d.ttsModel : '') + (VOICE_ID ? ' · 보이스 ' + VOICE_ID.slice(0, 4) + '…' + VOICE_ID.slice(-4) + ' (?vid)' : (d.ttsVoice ? ' · 보이스 ' + d.ttsVoice : '')));
      $('meta').textContent += '\n🔊 음성: ' + ttsLine;
      sessionOpen = true; setup.classList.add('hidden');
      if (TTS_OFF) addSys('목소리 꺼짐(?tts=off) - 글자로만 답해요.');
      else if (!ttsAvailable) addSys('ElevenLabs 키/보이스 설정이 없어서 글자로만 답해요. (ELEVENLABS_API_KEY, ELEVENLABS_VOICE_ID 확인)', true);
      addSys('이전 대화를 이어서 말하는 상태예요. 글자를 보내거나 마이크를 눌러 말해보세요.');
      refreshButtons(); txt.focus();
    } catch (e) {
      startBtn.disabled = false; startBtn.textContent = '다시 시도';
      setupWarn.style.display = 'block'; setupWarn.textContent = '연결하지 못했어요: ' + (e && e.message ? e.message : e);
    }
  }

  startBtn.addEventListener('click', enter);
  sendBtn.addEventListener('click', sendText);
  txt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendText(); } });
  orb.addEventListener('click', () => { if (recording) stopRec(true); else startRec(); });
  stopBtn.addEventListener('click', () => { if (busy) silenced = true; stopAll(); stopSong(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && recording) stopRec(false); });
  applyPersona('', '');
  refreshButtons();
  init();
})();
</script>
</body>
</html>
