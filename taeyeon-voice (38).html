<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>태연의 타로샵 — 음성으로 묻기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --plum-deep: #1c1220;
    --plum-mid: #2c1d33;
    --violet: #4a2f52;
    --gold: #cf9b4e;
    --gold-soft: #e8c78a;
    --rose: #c07b7f;
    --cream: #f1e7dc;
    --cream-dim: #b7a99a;
    --danger: #a85a4f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at 50% -10%, var(--plum-mid), var(--plum-deep) 60%);
    color: var(--cream);
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    overscroll-behavior: none;
  }
  #app {
    max-width: 480px; margin: 0 auto; height: 100dvh;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* Header */
  header {
    padding: 28px 24px 16px;
    text-align: center;
    border-bottom: 1px solid rgba(232,199,138,0.12);
  }
  header .eyebrow {
    font-size: 12px; letter-spacing: 0.02em; color: var(--cream-dim);
    margin: 0 0 6px;
  }
  header h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px; font-weight: 600; margin: 0;
    color: var(--gold-soft);
  }
  header .moon {
    width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 10px;
    background: radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 55%, transparent 75%);
    box-shadow: 0 0 22px rgba(207,155,78,0.35);
  }

  /* Transcript */
  #log {
    flex: 1; overflow-y: auto; padding: 20px 20px 8px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .bubble {
    max-width: 82%; padding: 11px 15px; border-radius: 16px;
    font-size: 15px; line-height: 1.5; white-space: pre-wrap;
  }
  .bubble.taeyeon {
    align-self: flex-start;
    background: var(--violet);
    border-bottom-left-radius: 4px;
    color: var(--cream);
  }
  .bubble.me {
    align-self: flex-end;
    background: rgba(207,155,78,0.16);
    border: 1px solid rgba(207,155,78,0.3);
    border-bottom-right-radius: 4px;
    color: var(--gold-soft);
  }
  .bubble.me.interim { opacity: 0.55; }
  .bubble.system {
    align-self: center;
    background: none; color: var(--cream-dim);
    font-size: 12.5px; padding: 4px 10px;
  }
  #log:empty::before {
    content: "마이크를 켜고 태연에게 말을 걸어보세요";
    display: block; text-align: center; color: var(--cream-dim);
    font-size: 14px; margin-top: 40px;
  }

  /* Control deck */
  #deck {
    padding: 18px 24px calc(28px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    border-top: 1px solid rgba(232,199,138,0.12);
  }
  #status {
    font-size: 13px; color: var(--cream-dim); min-height: 18px;
    display: flex; align-items: center; gap: 6px;
  }
  #status .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--cream-dim);
  }
  #status.live .dot { background: #7fbf8f; box-shadow: 0 0 8px #7fbf8f; }
  #status.listening .dot { background: var(--gold-soft); box-shadow: 0 0 8px var(--gold-soft); animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  #orb-wrap { position: relative; width: 108px; height: 108px; }
  #orb {
    width: 100%; height: 100%; border-radius: 50%;
    border: none; cursor: pointer;
    background: radial-gradient(circle at 38% 32%, #5a3a63, var(--plum-mid) 70%);
    box-shadow: 0 0 0 1px rgba(232,199,138,0.25), 0 10px 30px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  #orb:active { transform: scale(0.96); }
  #orb.on {
    background: radial-gradient(circle at 38% 32%, var(--gold-soft), var(--gold) 60%, #7a4f2e 100%);
    box-shadow: 0 0 0 1px rgba(232,199,138,0.5), 0 0 40px rgba(207,155,78,0.45);
  }
  #orb-ring {
    position: absolute; inset: -10px; border-radius: 50%;
    border: 1px solid rgba(232,199,138,0.35);
    opacity: 0; transition: opacity 0.3s ease;
    pointer-events: none;
  }
  #orb.on ~ #orb-ring, #orb-wrap.active #orb-ring { opacity: 1; animation: ring 1.6s ease-out infinite; }
  @keyframes ring { 0%{ transform: scale(0.9); opacity: 0.6; } 100%{ transform: scale(1.35); opacity: 0; } }
  #orb svg { width: 34px; height: 34px; }

  #hint { font-size: 12px; color: var(--cream-dim); text-align: center; }

  /* Text input row (텍스트로 입력해도 음성으로 답함) */
  #textRow {
    display: flex; align-items: center; gap: 8px; width: 100%;
  }
  #textInput {
    flex: 1; min-width: 0; padding: 11px 16px; border-radius: 999px;
    border: 1px solid rgba(232,199,138,0.25); background: rgba(0,0,0,0.25);
    color: var(--cream); font-size: 14px; font-family: inherit;
  }
  #textInput::placeholder { color: var(--cream-dim); }
  #textInput:disabled { opacity: 0.5; }
  #sendBtn {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: none;
    background: var(--gold); color: #2a1a10; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  #sendBtn:active { transform: scale(0.94); }
  #sendBtn:disabled { opacity: 0.35; cursor: default; }
  #sendBtn svg { width: 18px; height: 18px; }

  /* Setup overlay */
  #setup {
    position: fixed; inset: 0; background: rgba(12,7,14,0.92);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10;
  }
  #setup .card {
    background: var(--plum-mid); border: 1px solid rgba(232,199,138,0.18);
    border-radius: 18px; padding: 26px 22px; max-width: 380px; width: 100%;
  }
  #setup h2 { font-family: 'Noto Serif KR', serif; font-size: 18px; margin: 0 0 8px; color: var(--gold-soft); }
  #setup p { font-size: 13px; line-height: 1.6; color: var(--cream-dim); margin: 0 0 16px; }
  #setup input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(232,199,138,0.25);
    background: rgba(0,0,0,0.25); color: var(--cream); font-size: 14px; margin-bottom: 12px;
  }
  #setup button {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: var(--gold); color: #2a1a10; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  #setup .warn { font-size: 11.5px; color: var(--rose); margin-top: 10px; line-height: 1.5; }
  #setup.hidden { display: none; }
  #googleBtnWrap { display: flex; justify-content: center; margin-bottom: 4px; }
  #googleBtnWrap.hidden { display: none; }
</style>
</head>
<body>
<div id="app">

  <div id="setup">
    <div class="card">
      <h2>시작하기 전에</h2>
      <p id="setupText">태연과 연결할 준비를 하고 있어요…</p>
      <div id="googleBtnWrap" class="hidden"></div>
      <button id="startBtn" style="display:none;">입장하기</button>
      <div class="warn" id="setupWarn" style="display:none;"></div>
    </div>
  </div>

  <header>
    <div class="moon"></div>
    <p class="eyebrow">연남동, 작은 타로샵</p>
    <h1>태연</h1>
  </header>

  <div id="log"></div>

  <div id="deck">
    <div id="status"><span class="dot"></span><span id="statusText">연결 대기 중</span></div>
    <div id="orb-wrap">
      <button id="orb" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:#e8c78a">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </button>
      <div id="orb-ring"></div>
    </div>
    <div id="hint">누르면 대화 시작 · 다시 누르면 종료 · 글로 입력해도 태연은 목소리로 답해요</div>
    <div id="textRow">
      <input id="textInput" type="text" inputmode="text" placeholder="말 대신 글로 물어보기…" disabled autocomplete="off" />
      <button id="sendBtn" disabled aria-label="보내기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
(() => {
  // Railway에 토큰 서버 배포 후, 여기에 그 주소를 넣으세요.
  // 예: "https://taeyeon-token-server-production.up.railway.app/api/token"
  // token_server.py가 이 HTML 파일을 같은 서비스에서 함께 서빙하므로 같은 오리진(same-origin)이 되어
  // 상대 경로만으로 충분함. 도메인이 바뀌어도 이 줄을 고칠 필요 없음.
  //
  // 접속 모드:
  //  - 기본: 마이크 소리를 Gemini Live(gemini-3.8-live)에 그대로 보냄 (기존 방식)
  //  - ?stt=1 : 한국어 전용 음성인식(gemini-3.5-transcribe-live, ko-KR 고정)이 내 말을 글자로 바꾸고,
  //             그 텍스트만 Live 모델에 전달해서 태연의 목소리로 대답을 받음.
  //             (언어 자동판별이 아랍어/싱할라어 등으로 빗나가는 문제를 피하기 위한 모드)
  //  - &bargein=1 : ?stt=1 에서 태연이 말하는 도중에도 마이크를 열어 끼어들기 허용 (이어폰 권장)
  const Q = new URLSearchParams(location.search);
  const STT_MODE = Q.get('stt') === '1';
  const BARGE_IN = Q.get('bargein') === '1';
  // 구글 쪽 알려진 버그(서버가 interrupted 없이 turnComplete를 보내 대답이 문장/단어 중간에서 끊김) 대응:
  //  - 끊긴 걸 감지하면 자동으로 "끊긴 문장부터 이어서 말해줘"를 보낸다 (최대 AUTO_CONT_MAX번). ?autocont=0 이면 끔
  //  - ?nocompress=1 : 컨텍스트 압축(slidingWindow)을 끄고 시험해보는 용도 (10분 안쪽 테스트용 - 끄면 오디오 세션이 15분에서 끝남)
  const AUTO_CONT = Q.get('autocont') !== '0';
  const AUTO_CONT_MAX = 2;
  // 끊김이 이 시간(ms)보다 짧게 끝나고 이어지면 "또 끊겼네" 멘트 없이 조용히 이어가고, 이 시간 이상 걸렸으면 멘트를 한다.
  // 끊긴 순간(소켓이 닫힌 시각)부터 재연결이 끝날 때까지를 잰다. ?dropgap=밀리초 로 바꿔볼 수 있다 (0이면 항상 멘트).
  const _dropGapQ = Q.get('dropgap');
  const DROP_REMARK_MIN_MS = (_dropGapQ !== null && _dropGapQ !== '' && !isNaN(+_dropGapQ)) ? +_dropGapQ : 4000;
  const NO_COMPRESS = Q.get('nocompress') === '1';
  // 기본 모드에서 "1007 CONTENT_TYPE_AUDIO" (구글 쪽 알려진 버그)로 끊겨서
  // ?stt=1로 자동 리로드된 직후인지 표시 - 설정 화면에 안내 문구를 보여주기 위함
  let AUTO_STT_FALLBACK = false;
  try {
    if (sessionStorage.getItem('taeyeon_stt_fallback_notice') === '1') {
      AUTO_STT_FALLBACK = true;
      sessionStorage.removeItem('taeyeon_stt_fallback_notice');
    }
  } catch (_) {}
  const TOKEN_ENDPOINT = STT_MODE ? "/api/token?mode=stt" : "/api/token";
  const STT_TOKEN_ENDPOINT = "/api/token-stt";
  const VOICE_LOG_ENDPOINT = "/api/voice-log"; // 대화 기록(DB) 저장용 - 토큰 서버와 같은 서버
  const BUS_ROUTE_ENDPOINT = "/api/bus-route"; // find_bus_route 함수 호출(toolCall) 처리용
  const INTERCITY_ROUTE_ENDPOINT = "/api/intercity-route"; // find_intercity_route(기차/고속·시외버스 조회) 처리용
  const CONFIG_ENDPOINT = "/api/config";
  const GOOGLE_AUTH_ENDPOINT = "/api/auth/google";
  const STT_LANG = "ko-KR";
  const STT_DEBOUNCE_MS = 800; // 한 번 말하는 동안 여러 조각으로 확정돼도 하나로 묶어서 Live에 보내기 위한 대기 시간

  let MODEL = null; // 하드코딩하지 않고, 토큰 발급 시 서버가 내려주는 model 값을 그대로 사용한다.
                     // (서버의 LIVE_MODEL과 클라이언트가 어긋나면 토큰의 live_connect_constraints와
                     // 충돌해 엉뚱한/구형 모델 경로로 연결될 수 있어서, 항상 서버 기준을 따르게 함)
  // 페르소나(SYSTEM_PROMPT)는 token_server.py에서 토큰 발급 시점에 고정된다.
  // 임시 토큰 방식에서는 여기서 보내는 systemInstruction이 무시되므로 이 파일엔 두지 않는다.
  const $ = (id) => document.getElementById(id);
  const logEl = $('log'), statusEl = $('status'), statusText = $('statusText');
  const orb = $('orb'), orbWrap = $('orb-wrap');
  const setup = $('setup'), setupText = $('setupText'), setupWarn = $('setupWarn'), startBtn = $('startBtn');
  const googleBtnWrap = $('googleBtnWrap');
  const textInput = $('textInput'), sendBtn = $('sendBtn');

  // ---------- 구글 로그인 (서버가 GOOGLE_CLIENT_ID를 설정했을 때만 요구됨) ----------
  // 허용된 구글 계정으로만 입장하기 위한 로그인. 서버가 발급한 세션 토큰을 localStorage에 저장해두고,
  // 토큰 발급/음성기록 요청마다 Authorization 헤더로 실어 보낸다.
  const AUTH_TOKEN_KEY = 'taeyeon_auth_token';
  let authToken = null;
  try { authToken = localStorage.getItem(AUTH_TOKEN_KEY); } catch (_) {}
  let authRequired = false;   // /api/config로 확인 전까지는 모름 - 확인 전엔 아무것도 보여주지 않는다
  let googleClientId = '';
  function authHeaders() {
    return authToken ? { Authorization: 'Bearer ' + authToken } : {};
  }
  function saveAuthToken(token) {
    authToken = token;
    try { localStorage.setItem(AUTH_TOKEN_KEY, token); } catch (_) {}
  }
  // 세션이 만료됐거나(401) 아직 로그인 전이면 호출 - 로그인 화면으로 되돌린다
  function requireLogin(message) {
    authToken = null;
    try { localStorage.removeItem(AUTH_TOKEN_KEY); } catch (_) {}
    setup.classList.remove('hidden');
    startBtn.style.display = 'none';
    setupWarn.style.display = 'none';
    setupText.textContent = message || '구글 계정으로 로그인해야 입장할 수 있어요.';
    renderGoogleButton();
  }
  function renderGoogleButton() {
    if (!googleClientId || !window.google || !google.accounts || !google.accounts.id) {
      // 구글 로그인 스크립트가 아직 안 불려왔으면 잠시 후 다시 시도
      setTimeout(renderGoogleButton, 300);
      return;
    }
    googleBtnWrap.classList.remove('hidden');
    googleBtnWrap.innerHTML = '';
    google.accounts.id.initialize({ client_id: googleClientId, callback: onGoogleCredential });
    google.accounts.id.renderButton(googleBtnWrap, { theme: 'filled_black', size: 'large', shape: 'pill', text: 'continue_with', locale: 'ko' });
  }
  async function onGoogleCredential(response) {
    googleBtnWrap.classList.add('hidden');
    setupText.textContent = '로그인 확인 중…';
    try {
      const res = await fetch(GOOGLE_AUTH_ENDPOINT, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.sessionToken) {
        setupText.textContent = '허용되지 않은 구글 계정이에요.';
        setupWarn.style.display = 'block';
        setupWarn.textContent = '이 계정으로는 입장할 수 없어요. 관리자에게 문의해주세요.';
        renderGoogleButton();
        return;
      }
      saveAuthToken(data.sessionToken);
      setupWarn.style.display = 'none';
      showEnterButton();
    } catch (e) {
      setupText.textContent = '로그인 확인에 실패했어요.';
      setupWarn.style.display = 'block';
      setupWarn.textContent = '네트워크 상태를 확인하고 다시 시도해주세요.';
      renderGoogleButton();
    }
  }
  function showEnterButton() {
    googleBtnWrap.classList.add('hidden');
    startBtn.style.display = 'block';
    startBtn.disabled = false;
    startBtn.textContent = '입장하기';
    setupText.textContent = AUTO_STT_FALLBACK
      ? '방금 음성 연결에 문제가 있어서 음성 인식 모드로 자동 전환됐어요. 이어서 대화할 수 있어요.'
      : (STT_MODE
          ? '태연과 실시간 음성 대화를 시작해요. (한국어 전용 음성 인식 모드)'
          : '태연과 실시간 음성 대화를 시작해요.');
  }
  // 페이지가 뜨자마자 서버에 로그인 필요 여부를 물어보고, 필요하면 로그인 화면부터 보여준다.
  async function initAuthAndSetup() {
    try {
      const res = await fetch(CONFIG_ENDPOINT);
      const data = await res.json();
      authRequired = !!data.authRequired;
      googleClientId = data.googleClientId || '';
    } catch (e) {
      // 설정 조회 자체가 실패하면(서버 다운 등) 굳이 로그인을 막지 않고 기존처럼 진행 - 실제 실패는 이후 입장하기에서 드러남
      authRequired = false;
    }
    if (!authRequired) { showEnterButton(); return; }
    if (authToken) { showEnterButton(); return; } // 저장된 세션이 있으면 우선 시도해보고, 만료됐으면 입장하기 클릭 시 401로 걸러진다
    requireLogin();
  }

  let ws = null;
  let sessionOpen = false;   // socket connected + setupComplete
  let wsStt = null;          // (STT 모드) 한국어 음성인식 소켓
  let sttOpen = false;
  let STT_MODEL = null;
  let sttReconnectAttempts = 0;
  const STT_RECONNECT_DELAYS_MS = [0, 300, 900]; // Live 소켓과 동일한 취지: 첫 시도는 바로, 실패 반복 시에만 늘림
  let pendingStt = null;     // 무중단 교체용으로 미리 열어둔 새 STT 소켓
  let lastInterimAt = 0;     // 내가 말하는 중에 STT 소켓을 갈아타지 않기 위한 표시
  let pendingUserText = '';
  let sendTimer = null;

    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;';
    const btn = document.createElement('button');
    btn.textContent = '서버로 보낸 내 목소리 듣기 (최근 15초)';
    btn.style.cssText = 'padding:9px 14px;border-radius:10px;border:1px solid rgba(232,199,138,0.4);background:none;color:#e8c78a;font-size:12.5px;cursor:pointer;';
    const player = document.createElement('audio');
    player.controls = true; player.style.width = '100%';
    btn.onclick = () => {
      if (!dbgSamples) { addSystemLine('아직 녹음된 소리가 없어요. 마이크를 켜고 말해본 뒤 눌러주세요.'); return; }
      player.src = URL.createObjectURL(dbgWavBlob());
      player.play().catch(() => {});
      addSystemLine(`디버그: ${dbgRate}Hz, ${(dbgSamples / dbgRate).toFixed(1)}초 분량`);
    };
    wrap.append(btn, player);
    document.getElementById('deck').appendChild(wrap);
  }

  const activeSources = new Set(); // 예약/재생 중인 출력 오디오 소스 - 끼어들기(interrupted) 때 한꺼번에 멈추기 위해 추적

  let curTaeyeonBubble = null;
  let curMeBubble = null;

  const MAX_LOG_BUBBLES = 120; // 화면에 남겨둘 말풍선 최대 개수 - 오래된 건 화면에서만 지움 (실제 대화 맥락/기억엔 영향 없음)
  function pruneLog() {
    while (logEl.children.length > MAX_LOG_BUBBLES) {
      logEl.removeChild(logEl.firstChild);
    }
  }
  let scrollScheduled = false;
  function scrollLogToBottom() {
    // 글자 조각 하나하나마다 매번 강제로 레이아웃을 다시 계산하면 대화가 길어질수록 버벅이다가
    // 스크롤이 안 따라가는 것처럼 보일 수 있어서, 애니메이션 프레임당 한 번으로 묶어서 처리
    if (scrollScheduled) return;
    scrollScheduled = true;
    requestAnimationFrame(() => {
      logEl.scrollTop = logEl.scrollHeight;
      scrollScheduled = false;
    });
  }
  function addSystemLine(text) {
    const d = document.createElement('div');
    d.className = 'bubble system';
    d.textContent = text;
    logEl.appendChild(d);
    pruneLog();
    scrollLogToBottom();
  }
  function ensureBubble(who) {
    const cls = who === 'taeyeon' ? 'taeyeon' : 'me';
    const cur = who === 'taeyeon' ? curTaeyeonBubble : curMeBubble;
    if (cur) return cur;
    const d = document.createElement('div');
    d.className = 'bubble ' + cls;
    logEl.appendChild(d);
    pruneLog();
    scrollLogToBottom();
    if (who === 'taeyeon') curTaeyeonBubble = d; else curMeBubble = d;
    return d;
  }
  function appendText(who, text) {
    const b = ensureBubble(who);
    b.textContent = (b.textContent || '') + text;
    scrollLogToBottom();
  }
  // ---------- 턴별 진단: 대답이 중간에 끊기는 원인 추적용 (콘솔 '[디버그][턴 요약]' 한 줄) ----------
  let turnStartAt = 0, turnFirstAudioAt = 0, turnAudioSamples = 0;
  let turnHadSearch = false, turnInterrupted = false, turnTranscript = '';
  // 재생 도중 오디오가 바닥나서 실제로 소리가 끊긴 횟수/길이 - 서버가 말 도중 오래 멈추는지(=듣는 사람이 체감하는 끊김) 확인용.
  // (Live 메시지 도착 간격은 청크가 실시간보다 빨리 몰려오고 백그라운드 탭에선 수신이 지연돼서 실제 침묵과 무관하다)
  let turnUnderrunCount = 0, turnUnderrunMaxMs = 0, turnUnderrunSumMs = 0, turnPlayChunks = 0;
  let autoContCount = 0; // 이번 사용자 발화에 대해 자동으로 '이어서 말해줘'를 보낸 횟수
  let sessionStartAt = 0, lastGoAwayAt = 0; // Live 연결이 열린 시각 / 마지막 GoAway 수신 시각 (끊김이 '연결 시간'과 관련 있는지 보기 위함)
  function resetTurnStats(fromUserText) {
    turnStartAt = fromUserText ? performance.now() : 0;
    turnFirstAudioAt = 0; turnAudioSamples = 0;
    turnHadSearch = false; turnInterrupted = false; turnTranscript = '';
    turnUnderrunCount = 0; turnUnderrunMaxMs = 0; turnUnderrunSumMs = 0; turnPlayChunks = 0;
  }
  // 자막(출력 전사) 글자 수 대비 오디오가 이 값(초/글자)보다 짧으면 "뒷부분 음성이 잘렸다"고 의심한다.
  // 한국어 TTS가 아무리 빨라도 이보다 빠르게 말하진 않는다는 가정의 여유 있는(보수적인) 하한선 - 오탐(false positive)을 줄이기 위해 넉넉히 잡음.
  const MIN_SEC_PER_CHAR = 0.09;
  const TRAILING_CLIP_MARGIN_SEC = 0.35;

  function logTurnSummary(usage) {
    const audioSec = turnAudioSamples / 24000;
    const tail = turnTranscript.trim();
    if (audioSec === 0 && !tail) { resetTurnStats(false); return; }
    const now = performance.now();
    const endsClean = /[.!?~…]$/.test(tail);
    // 문장부호로 끝났더라도, 오디오 길이가 자막 글자 수에 비해 지나치게 짧으면
    // 자막(텍스트)은 다 도착했는데 실제 음성 합성은 끝을 못 채우고 턴이 끝난 것 - "뒷부분 몇 글자를 안 말하고 생략"되는 증상.
    const expectedMinSec = tail.length * MIN_SEC_PER_CHAR;
    const trailingClipped = !!tail && audioSec > 0 && audioSec < expectedMinSec - TRAILING_CLIP_MARGIN_SEC;
    const suspect = !turnInterrupted && !!tail && (!endsClean || trailingClipped); // interrupted 없이 끝났는데 문장부호로 안 끝나거나, 오디오가 너무 짧음
    const u = usage || {};
    const info = {
      오디오길이초: +audioSec.toFixed(1),
      말보내고_첫오디오까지초: (turnStartAt && turnFirstAudioAt) ? +((turnFirstAudioAt - turnStartAt) / 1000).toFixed(1) : null,
      첫오디오_종료까지초: turnFirstAudioAt ? +((now - turnFirstAudioAt) / 1000).toFixed(1) : null,
      검색사용: turnHadSearch,
      연결후경과분: sessionStartAt ? +((Date.now() - sessionStartAt) / 60000).toFixed(1) : null,
      재생끊김횟수: turnUnderrunCount, 재생끊김_최대초: +(turnUnderrunMaxMs / 1000).toFixed(1), 재생끊김_합계초: +(turnUnderrunSumMs / 1000).toFixed(1),
      GoAway수신후경과초: lastGoAwayAt ? Math.round((Date.now() - lastGoAwayAt) / 1000) : null,
      응답토큰: u.responseTokenCount, 생각토큰: u.thoughtsTokenCount || 0, 프롬프트토큰: u.promptTokenCount,
      마지막말: tail.slice(-14),
      끊김의심: suspect, 뒷부분잘림의심: trailingClipped
    };
    console.log('[디버그][턴 요약]', JSON.stringify(info));
    if (trailingClipped) dbgNote(`자막은 다 왔는데 오디오가 짧아서 뒷부분 음성이 잘린 것 같아요 - 오디오 ${audioSec.toFixed(1)}초(예상 최소 ${expectedMinSec.toFixed(1)}초), 마지막: "${tail.slice(-14)}"`);
    else if (suspect) dbgNote(`대답이 문장 중간에서 끝난 것 같아요 (서버가 interrupted 없이 generationComplete로 종료) - 오디오 ${audioSec.toFixed(1)}초, 마지막: "${tail.slice(-14)}"`);
    const doCont = suspect && AUTO_CONT && audioSec >= 1 && autoContCount < AUTO_CONT_MAX;
    resetTurnStats(false);
    if (doCont) scheduleAutoContinue(tail, trailingClipped);
  }

  // 서버가 말 중간에 턴을 끝내버렸을 때: 태연이 남은 소리를 다 재생하길 기다렸다가,
  // 끊긴 문장 조각을 알려주며 처음부터 이어서 마무리해달라고 텍스트로 요청한다.
  // trailingOnly가 true면(자막은 정상적으로 문장부호까지 끝났지만 오디오만 짧은 경우) 마지막 문장부호를 기준으로
  // 자르면 조각이 비어버리므로, 그냥 마지막 몇 글자를 그대로 잘라 "그 뒷부분을 못 들었다"는 식으로 넘긴다.
  function scheduleAutoContinue(tail, trailingOnly, remark = false) {
    autoContCount++;
    let frag = trailingOnly ? '' : (tail.match(/[^.!?~…]*$/) || [tail])[0].trim();
    if (!frag) frag = tail.slice(-30).trim();
    frag = frag.slice(-60);
    const startedAt = Date.now();
    const timer = setInterval(() => {
      // 사용자가 말하기 시작했거나(말풍선/대기 텍스트), 너무 오래 기다렸으면 포기
      if (Date.now() - startedAt > 20000 || curMeBubble || pendingUserText || sendTimer) { clearInterval(timer); return; }
      if (isModelSpeaking()) return; // 아직 재생 중
      clearInterval(timer);
      if (!sessionOpen || !ws || ws.readyState !== WebSocket.OPEN) return;
      dropModelAudio = false; modelTurnActive = false;
      resetTurnStats(true);
      markTurnPending();
      autoContTurn = true;
      console.log(`[디버그] 끊긴 대답 자동 이어말하기 전송 (${autoContCount}/${AUTO_CONT_MAX}):`, frag);
      sendRealtimeText(remark
        ? `(방금 하던 말 중 "${frag}" 부분을 상대가 못 들었어. 먼저 "어, 또 끊겼네"나 "앗, 또 끊겼다" 같은 짧은 한마디를 꼭 자연스럽게 하고, 바로 이어서 그 문장을 처음부터 말하고 하려던 얘기를 끝까지 마무리해줘. 끊긴 이유를 설명하거나 길게 사과하지 말고 그 한마디만 해.)`
        : `(방금 하던 말 중 "${frag}" 부분을 상대가 못 들었어. 그 문장을 처음부터 자연스럽게 말하고, 하려던 얘기를 끝까지 이어서 마무리해줘. 이 요청이나 끊김에 대해서는 절대 말하지 말고, 원래 대화가 계속되는 것처럼 바로 본론만 말해.)`);
    }, 250);
  }

  // realtimeInput.text를 보낼 때는 항상 이 함수를 거쳐서, "응답을 아직 못 받은 메시지"를 추적한다.
  function sendRealtimeText(text) {
    awaitingUserText = text;
    ws.send(JSON.stringify({ realtimeInput: { text } }));
  }

  // 끊기기 직전 '응답을 하나도 못 받은' 메시지를, 재연결이 끝난 뒤 그대로 다시 물어본다.
  // (scheduleAutoContinue와 같은 방식: 내가 그새 다른 말을 시작했으면 포기하고, 모델이 말하는 중이 아닐 때까지 기다렸다가 보낸다)
  function scheduleResumeAsk(text, notice = false) {
    const startedAt = Date.now();
    const timer = setInterval(() => {
      if (Date.now() - startedAt > 20000 || curMeBubble || pendingUserText || sendTimer) { clearInterval(timer); return; }
      if (isModelSpeaking()) return;
      clearInterval(timer);
      if (!sessionOpen || !ws || ws.readyState !== WebSocket.OPEN) return;
      dropModelAudio = false; modelTurnActive = false;
      resetTurnStats(true);
      markTurnPending();
      console.log('[디버그] 끊기기 직전 응답 못 받은 메시지 자동 재전송:', text);
      dbgNote('끊기기 직전에 물어봤다가 응답을 못 받은 게 있어서 다시 물어볼게요');
      if (notice) autoContTurn = true; // 끊김 멘트는 DB 기록에서 제외(맥락 오염 방지)
      sendRealtimeText(notice ? `${text}\n(참고: 방금 연결이 잠깐 끊겼다가 다시 연결됐어. 답하기 전에 "어, 또 끊겼네" 같은 짧은 한마디를 꼭 자연스럽게 먼저 하고, 바로 이어서 답해줘.)` : text);
    }, 250);
  }

  // 재연결(일반 재연결 또는 무중단 교체)이 끝날 때마다 호출 - 끊기기 직전 상태에 따라 자동 복구를 시도한다.
  function triggerResumeAfterReconnect() {
    try { sessionStorage.removeItem('taeyeon_resume_user_text'); sessionStorage.removeItem('taeyeon_resume_continue_frag'); sessionStorage.removeItem('taeyeon_drop_notice'); sessionStorage.removeItem('taeyeon_drop_at'); } catch (_) {}
    const dropped = dropNoticePending; dropNoticePending = false;
    const gapMs = dropped && dropAt ? Date.now() - dropAt : 0; dropAt = 0;
    // 끊겼다가 이어지기까지 짧았으면(체감상 거의 못 느낌) 조용히 이어가고, 오래 걸렸으면 "또 끊겼네" 멘트를 한다
    const needRemark = dropped && gapMs >= DROP_REMARK_MIN_MS;
    if (dropped) {
      console.log(`[디버그] 끊김 ${(gapMs / 1000).toFixed(1)}초 만에 복구 - 기준 ${(DROP_REMARK_MIN_MS / 1000).toFixed(1)}초 → ${needRemark ? '"또 끊겼네" 멘트 함' : '멘트 없이 조용히 이어감'}`);
      dbgNote(`끊김 ${(gapMs / 1000).toFixed(1)}초 후 복구 (${needRemark ? '멘트 함' : '짧아서 멘트 생략'})`);
    }
    if (AUTO_CONT && resumeUserText) {
      const rtext = resumeUserText; resumeUserText = ''; resumeContinueFrag = '';
      scheduleResumeAsk(rtext, needRemark);
      return;
    }
    if (AUTO_CONT && resumeContinueFrag) {
      const frag = resumeContinueFrag; resumeContinueFrag = '';
      if (autoContCount < AUTO_CONT_MAX) { scheduleAutoContinue(frag, false, needRemark); return; }
    }
    resumeUserText = ''; resumeContinueFrag = '';
    // 이어받을 게 없는 끊김이라도, 오래 끊겼다면 끊겼다는 한마디는 하게 한다
    if (needRemark) scheduleDropRemark();
  }

  // 끊김 후 복구됐을 때 "또 끊겼네" 한마디만 시킨다 (상대가 말을 시작했거나 20초가 지나면 포기)
  function scheduleDropRemark() {
    const startedAt = Date.now();
    const timer = setInterval(() => {
      if (Date.now() - startedAt > 20000 || curMeBubble || pendingUserText || sendTimer) { clearInterval(timer); return; }
      if (isModelSpeaking()) return;
      clearInterval(timer);
      if (!sessionOpen || !ws || ws.readyState !== WebSocket.OPEN) return;
      dropModelAudio = false; modelTurnActive = false;
      resetTurnStats(true);
      markTurnPending();
      autoContTurn = true; // 끊김 멘트는 DB 기록에서 제외
      console.log('[디버그] 끊김 복구 - 끊겼다는 한마디 요청 전송');
      sendRealtimeText('(방금 연결이 잠깐 끊겼다가 다시 연결됐어. "어, 또 끊겼네"나 "앗, 잠깐 끊겼었네" 같은 짧은 한마디만 자연스럽게 하고, 그다음엔 상대가 말할 때까지 기다려. 길게 설명하지 마.)');
    }, 250);
  }

  function closeTurn() {
    curTaeyeonBubble = null;
    if (!STT_MODE) curMeBubble = null; // STT 모드에선 내 말풍선을 STT 이벤트가 직접 관리
  }

  function setStatus(mode, text) {
    statusEl.className = mode;
    statusText.textContent = text;
  }

  // ---------- base64 helpers ----------
  function base64FromInt16(int16arr) {
    const bytes = new Uint8Array(int16arr.buffer);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }
  function int16FromBase64(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Int16Array(bytes.buffer);
  }

  // ---------- output playback (24kHz PCM16) ----------
  function playPcm24k(int16arr) {
    if (!outputCtx) return;
    const float32 = new Float32Array(int16arr.length);
    for (let i = 0; i < int16arr.length; i++) float32[i] = int16arr[i] / 32768;
    const buffer = outputCtx.createBuffer(1, float32.length, 24000);
    buffer.copyToChannel(float32, 0);
    const src = outputCtx.createBufferSource();
    src.buffer = buffer;
    src.connect(outputCtx.destination);
    activeSources.add(src);
    src.onended = () => activeSources.delete(src);
    const now = outputCtx.currentTime;
    if (playHead < now) {
      // 같은 대답 도중(첫 청크가 아님)인데 재생할 오디오가 이미 바닥났다 = 실제로 소리가 끊긴 구간 (0.1초 미만 지터는 무시)
      const gapMs = (now - playHead) * 1000;
      if (turnPlayChunks > 0 && gapMs >= 100) {
        turnUnderrunCount++; turnUnderrunSumMs += gapMs; turnUnderrunMaxMs = Math.max(turnUnderrunMaxMs, gapMs);
      }
      playHead = now + 0.05;
    }
    turnPlayChunks++;
    src.start(playHead);
    playHead += buffer.duration;
  }

  // 서버가 interrupted를 보내면, 이미 예약해 둔 오디오도 전부 멈춰야 한다.
  // (playHead만 되돌리면 예약된 소스는 그대로 재생돼서 옛 대답이 겹쳐 들리고, 그게 다시 마이크로 들어간다)
  function stopPlayback() {
    activeSources.forEach((s) => { try { s.stop(); } catch (_) {} });
    activeSources.clear();
    playHead = outputCtx ? outputCtx.currentTime : 0;
    modelTurnActive = false;
  }

  // ---------- token fetch ----------
  // withHistory: 이어붙일 세션 핸들 없이 '새 세션'을 시작하는 경우 true - 서버가 DB의 직전 대화 기록을 프롬프트에 실어준다.
  //   (핸들로 이어붙이는 경우엔 대화 맥락이 이미 서버 세션에 있으니 false여야 중복되지 않는다)
  async function fetchToken(opts = {}) {
    const withHistory = !!opts.withHistory;
    if (withHistory) { // 방금 끝난 턴까지 DB에 들어간 뒤에 읽어가도록: 끊긴 채 남은 태연 말도 확정하고, 전송을 (최대 2초) 기다린다
      commitModelText();
      await Promise.race([flushVoiceLog(), new Promise((r) => setTimeout(r, 2000))]);
    }
    const url = new URL(TOKEN_ENDPOINT, location.href);
    url.searchParams.set('sid', VOICE_SID);
    if (withHistory) url.searchParams.set('history', '1');
    const res = await fetch(url.toString(), { method: 'POST', headers: authHeaders() });
    if (res.status === 401) { requireLogin('로그인이 만료됐어요. 다시 로그인해주세요.'); throw new Error('auth_expired'); }
    if (!res.ok) throw new Error('token fetch failed: ' + res.status);
    const data = await res.json();
    if (data.model) MODEL = data.model;
    lastHistoryCount = withHistory ? (Number(data.historyCount) || 0) : 0;
    liveToken = data.token;
    liveTokenAt = Date.now();
    liveTokenHist = withHistory;
    return data.token;
  }

  async function fetchSttToken() {
    const res = await fetch(STT_TOKEN_ENDPOINT, { method: 'POST', headers: authHeaders() });
    if (!res.ok) throw new Error('stt token fetch failed: ' + res.status);
    const data = await res.json();
    if (data.model) STT_MODEL = data.model;
    return data.token;
  }

  // 태연이 지금(또는 방금까지) 말하고 있는지 - 스피커 소리가 마이크로 들어가 STT가 태연의 목소리를 내 말로 듣는 것을 막기 위함
  // - 재생 예약된 오디오가 남아있거나 끝난 지 0.4초 이내이거나(playHead==0 이면 아직 한 번도 재생한 적 없음),
  // - 대답 생성이 진행 중인 동안(오디오 조각 사이가 잠깐 벌어지는 구간 포함).
  //   이 구간을 '말하는 중'으로 안 보면, 조각 사이에 마이크가 열려 태연의 목소리가 내 말로 인식되고,
  //   그 텍스트가 Live로 들어가 대답이 문장 중간에서 끊긴다.
  function isModelSpeaking() {
    if (turnPending) {
      if (Date.now() - turnPendingAt < TURN_PENDING_MAX_MS) return true;
      turnPending = false; // 너무 오래 신호가 없으면 예전 동작으로 복귀 (마이크/교체가 영원히 막히지 않게)
    }
    if (!outputCtx) return false;
    // 화면이 꺼지면 모바일에서 outputCtx가 suspended/interrupted가 되는데, 그동안 currentTime이 멈춰 있어서
    // 이 조건이 영원히 참이 된다 -> 반이중 모드에서 마이크가 영구 차단되고 인식 결과도 전부 버려진다.
    // 그래서 실제로 소리가 나고 있는(running) 때만 재생 중으로 본다.
    if (outputCtx.state === 'running' && playHead > 0 && outputCtx.currentTime < playHead + 0.4) return true;
    return modelTurnActive && (Date.now() - lastLiveMsgAt) < 6000;
  }

  let inputEverEnabled = false; // 처음 연결이 아니라 '재연결'일 때만 포커스를 옮기기 위한 표시
  function refocusTextInput() {
    if (window.matchMedia && matchMedia('(pointer: coarse)').matches) return;
    const doFocus = () => {
      const a = document.activeElement;
      const stolenByNothing = !a || a === document.body || a === orb || a === sendBtn;
      if (stolenByNothing && !textInput.disabled) textInput.focus({ preventScroll: true });
    };
    doFocus();
    setTimeout(doFocus, 150); // 재연결 직후 다른 UI 갱신이 포커스를 가져가는 경우를 한 번 더 보정
  }
  function updateReady() {
    const ready = sessionOpen && (!STT_MODE || sttOpen);
    orb.disabled = !ready;
    // 텍스트 입력은 음성 인식(STT) 소켓과 무관하게 Live 연결(ws)만 열려 있으면 바로 쓸 수 있다
    const wasDisabled = textInput.disabled;
    textInput.disabled = !sessionOpen;
    sendBtn.disabled = !sessionOpen;
    // 연결이 끊기면 입력창이 disabled가 되면서 포커스가 사라져 엉뚱한 곳(body/버튼)에 남는다.
    // 재연결로 다시 켜질 때 입력창으로 포커스를 되돌린다 (다른 입력 요소에 사용자가 일부러 둔 포커스는 건드리지 않고, 터치 기기는 키보드가 갑자기 뜨지 않게 제외)
    if (wasDisabled && sessionOpen) {
      if (inputEverEnabled) refocusTextInput();
      inputEverEnabled = true;
    }
    if (!micOn) {
      if (ready) setStatus('live', '연결됨');
      else if (sessionOpen && STT_MODE) setStatus('', '음성 인식 연결하는 중…');
    }
  }

  // ---------- (STT 모드) 한국어 음성인식 WebSocket ----------
  function cleanTranscript(t) {
    return (t || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  }

  // 반이중(기본): 태연이 말하는 동안 도착한 인식 결과는 스피커 소리(에코)이거나 잡음일 가능성이 높아서 버린다.
  function shouldIgnoreStt() { return STT_MODE && !BARGE_IN && isModelSpeaking(); }

  // bargein 모드에서, 숨소리/헛기침/이어폰 소리 누출 같은 잡음이 한두 글자로 잘못 인식되는 것만으로
  // 태연이 매번 끊기는 걸 막기 위한 최소 필터. 실제 사용자가 끼어들려는 의도가 있는 발화(예: "잠깐",
  // "그만", "아니야")는 보통 이 정도 길이는 되므로 정상적인 끼어들기는 거의 막지 않는다.
  // ⚠️ 태연이 조용할 때(자기 차례가 아닐 때) 사용자가 "응", "네" 같은 짧은 대답을 하는 건 정상이므로,
  // 이 필터는 '태연이 말하는 도중에 끼어들려는 시도'일 때만 적용하고 평소 짧은 대답엔 적용하지 않는다.
  const NOISE_ONLY_WORDS = new Set(['어', '음', '아', '흠', '그', '네', '엥', '헉', 'ㅇ', 'ㅇㅇ']);
  function looksLikeIntentionalSpeech(text) {
    const t = (text || '').replace(/[.,!?~…\s]/g, '');
    if (t.length < 2) return false;               // 한두 글자짜리 잡음 필터
    if (NOISE_ONLY_WORDS.has(t)) return false;     // 흔한 잡음성 감탄사만 있는 경우 필터
    return true;
  }
  let bargeInCandidateActive = false; // 이번 발화가 '태연이 말하는 도중'에 시작됐는지 (끼어들기 시도인지)

  function onSttInterim(text) {
    if (shouldIgnoreStt()) return;
    if (!text) return;
    if (!curMeBubble) bargeInCandidateActive = BARGE_IN && isModelSpeaking(); // 이 발화의 첫 조각일 때만 판정
    lastInterimAt = Date.now();
    if (bargeInCandidateActive && looksLikeIntentionalSpeech(text)) { // 끼어들기: 태연 재생을 즉시 멈추고, 취소된 대답의 남은 오디오는 버림
      stopPlayback();
      dropModelAudio = true;
      turnPending = false; // 내가 직접 끼어든 것 - 곧 새 입력이 전송되면서 다시 표시된다
    }
    const b = ensureBubble('me');
    b.classList.add('interim');
    b.textContent = text;
    scrollLogToBottom();
  }

  function onSttFinal(text) {
    if (shouldIgnoreStt()) {
      if (text) dbgNote('태연이 말하는 중에 들어온 인식 결과라 무시했어요(에코 방지): "' + text + '"');
      if (curMeBubble) { curMeBubble.remove(); curMeBubble = null; }
      bargeInCandidateActive = false;
      return;
    }
    if (!text) { // 빈 결과면 임시 말풍선 정리
      if (curMeBubble) { curMeBubble.remove(); curMeBubble = null; }
      bargeInCandidateActive = false;
      return;
    }
    if (bargeInCandidateActive && !looksLikeIntentionalSpeech(text)) { // 끼어들기 시도였는데 알고 보니 잡음성 한두 글자 - 모델한테 새 메시지로 보내지 않음
      dbgNote('끼어들기로 감지됐지만 잡음일 가능성이 높은 짧은 인식 결과라 무시했어요: "' + text + '"');
      if (curMeBubble) { curMeBubble.remove(); curMeBubble = null; }
      bargeInCandidateActive = false;
      return;
    }
    bargeInCandidateActive = false;
    const b = ensureBubble('me');
    b.classList.remove('interim');
    b.textContent = text;
    curMeBubble = null;
    scrollLogToBottom();
    pendingUserText = (pendingUserText + ' ' + text).trim();
    clearTimeout(sendTimer);
    sendTimer = setTimeout(flushUserText, STT_DEBOUNCE_MS);
  }

  function flushUserText() {
    sendTimer = null;
    const text = pendingUserText.trim();
    if (!text) { pendingUserText = ''; return; }
    if (!sessionOpen || !ws || ws.readyState !== WebSocket.OPEN) {
      // 재연결 중일 수 있으니 최대 8초까지 기다렸다가 보낸다
      if (flushRetry < 8) { flushRetry++; sendTimer = setTimeout(flushUserText, 1000); return; }
      flushRetry = 0; pendingUserText = '';
      addSystemLine('연결이 끊겨 있어서 방금 한 말이 전달되지 못했어요.');
      return;
    }
    flushRetry = 0;
    pendingUserText = '';
    if (isModelSpeaking()) dbgNote((turnPending ? '태연이 대답을 준비하는 중에' : '태연이 말하는 도중에') + ' 새 입력을 보내서 대답이 끊깁니다: "' + text + '"');
    dropModelAudio = false; // 새 턴 시작
    modelTurnActive = false;
    console.log('[디버그] Live로 전송할 텍스트:', text);
    autoContCount = 0;
    resetTurnStats(true);
    markTurnPending();
    commitModelText();            // 끊긴(또는 방금 끝난) 이전 대답을 먼저 확정한 뒤
    autoContTurn = false;         // 새 사용자 발화부터는 일반 대화
    queueVoiceLog('user', text);  // 내 말을 기록 (순서: 태연 → 나)
    sendRealtimeText(text);
  }

  // 오디오 출력 컨텍스트는 사용자 제스처(클릭/엔터) 안에서 만들어야 브라우저 자동재생 정책에 안 걸린다.
  // 마이크 버튼뿐 아니라 텍스트 전송(버튼 클릭/엔터)도 사용자 제스처이므로 여기서도 준비해준다.
  function ensureOutputCtx() {
    if (outputCtx && outputCtx.state !== 'closed') return outputCtx;
    outputCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    const c = outputCtx;
    c.onstatechange = () => console.log('[디버그] outputCtx 상태 변화:', c.state);
    return outputCtx;
  }

  // ---------- 연결 끊김/재연결 알림음 (짧은 비프음, 태연의 목소리와 같은 출력 경로를 쓰되 별도 노드로 재생) ----------
  function playTone(ctx, freq, offsetSec, durSec, gainPeak = 0.16) {
    const t0 = ctx.currentTime + offsetSec;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(gainPeak, t0 + 0.02);
    gain.gain.linearRampToValueAtTime(0, t0 + durSec);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + durSec + 0.03);
  }
  function playDisconnectAlert(isFinal) {
    try {
      const ctx = ensureOutputCtx();
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      if (isFinal) { // 재연결 완전 실패 - 낮은 음 3번 (더 확실한 경고)
        playTone(ctx, 392, 0, 0.16); playTone(ctx, 330, 0.18, 0.16); playTone(ctx, 262, 0.36, 0.3);
      } else { // 일반 끊김 - 짧게 두 번 하강
        playTone(ctx, 660, 0, 0.14); playTone(ctx, 440, 0.16, 0.2);
      }
    } catch (e) { console.warn('[디버그] 알림음 재생 실패:', e); }
  }
  function playReconnectedChime() {
    try {
      const ctx = ensureOutputCtx();
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      playTone(ctx, 523.25, 0, 0.1, 0.13);   // C5
      playTone(ctx, 783.99, 0.09, 0.16, 0.13); // G5
    } catch (e) { console.warn('[디버그] 알림음 재생 실패:', e); }
  }

  // ---------- 텍스트 직접 입력 (응답 모달리티는 항상 AUDIO라서, 글로 물어봐도 태연은 목소리로 답한다) ----------
  function sendTypedText(text) {
    text = (text || '').trim();
    if (!text) return;
    if (!sessionOpen || !ws || ws.readyState !== WebSocket.OPEN) {
      addSystemLine('아직 연결되지 않았거나 연결이 끊겨 있어서 메시지를 보낼 수 없어요.');
      return;
    }
    ensureOutputCtx(); // 마이크를 한 번도 안 켰어도 음성 답변이 재생되도록 보장
    if (outputCtx.state === 'suspended') outputCtx.resume().catch(() => {});
    // 마이크가 켜져 있는 채로 글을 보내면 소리와 글이 동시에 들어가 꼬일 수 있으니, 텍스트 전송 시 마이크는 자동으로 끈다
    if (micOn) {
      stopMic();
      orb.classList.remove('on');
      orbWrap.classList.remove('active');
    }
    // 태연이 말하는 도중에 글을 보내면, 마이크로 끼어드는 것과 똑같이 기존 대답을 멈추고 새로 답하게 한다
    if (isModelSpeaking()) stopPlayback();

    // 화면에 내 말풍선 추가 (음성 인식을 거치지 않은 입력이므로 직접 새 말풍선을 만든다)
    curTaeyeonBubble = null;
    curMeBubble = null;
    const b = ensureBubble('me');
    b.textContent = text;
    curMeBubble = null;

    dropModelAudio = false;
    modelTurnActive = false;
    autoContCount = 0;
    resetTurnStats(true);
    markTurnPending();
    commitModelText();
    autoContTurn = false;
    queueVoiceLog('user', text);
    console.log('[디버그] Live로 전송할 텍스트(직접 입력):', text);
    sendRealtimeText(text);
  }

  sendBtn.addEventListener('click', () => {
    sendTypedText(textInput.value);
    textInput.value = '';
    textInput.focus();
  });
  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      sendTypedText(textInput.value);
      textInput.value = '';
    }
  });

  // 전용 전사 세션도 약 10분마다 서버가 끊는다(GoAway) - 내가 말을 멈춘 틈에 새 소켓을 미리 열어 갈아탄다
  function onSttGoAway(timeLeft) {
    const ms = parseDurationMs(timeLeft);
    dbgNote(`음성 인식 연결이 곧 끊긴다고 알렸어요(GoAway, ${Math.round(ms / 1000)}초 남음) - 새 연결로 갈아탈게요`);
    const deadline = Date.now() + Math.max(500, ms - 3000);
    const timer = setInterval(async () => {
      if (Date.now() < deadline && Date.now() - lastInterimAt < 1500) return; // 말하는 중이면 잠깐 기다림
      clearInterval(timer);
      if (pendingStt) return;
      try { connectStt(await fetchSttToken(), { swap: true }); }
      catch (e) { console.warn('[디버그][STT] 무중단 교체 준비 실패:', e); }
    }, 300);
  }

  function connectStt(token, opts = {}) {
    const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContentConstrained?access_token=${encodeURIComponent(token)}`;
    const sock = new WebSocket(url);
    if (opts.swap) pendingStt = sock;
    else {
      // 화면 복귀(visibilitychange)와 onclose 재연결이 겹쳐 connectStt가 두 번 불리면
      // 먼저 만든 소켓이 아무도 모르게 열린 채 남는다 - 새 소켓으로 갈아끼울 때 옛 소켓은 닫는다
      const old = wsStt;
      wsStt = sock;
      if (old && old !== sock) { try { old.close(); } catch (_) {} }
    }

    sock.onopen = () => {
      sock.send(JSON.stringify({
        setup: {
          model: STT_MODEL,
          generationConfig: { responseModalities: ["TEXT"] },
          realtimeInputConfig: {
            automaticActivityDetection: {
              startOfSpeechSensitivity: "START_SENSITIVITY_HIGH",
              endOfSpeechSensitivity: "END_SENSITIVITY_HIGH",
              silenceDurationMs: 600
            }
          },
          inputAudioTranscription: { languageCodes: [STT_LANG] }
        }
      }));
    };

    sock.onmessage = async (event) => {
      let raw = event.data;
      if (raw instanceof Blob) raw = await raw.text();
      let msg;
      try { msg = JSON.parse(raw); } catch (e) { console.log('[디버그][STT] JSON 파싱 실패:', raw); return; }
      if (sock !== wsStt && sock !== pendingStt) return; // 이미 교체된 옛 소켓
      console.log('[디버그][STT] 수신:', JSON.stringify(msg));

      if (msg.setupComplete) {
        if (sock === pendingStt) { // 무중단 교체 완료
          const old = wsStt;
          wsStt = sock; pendingStt = null;
          try { old && old.close(); } catch (_) {}
          dbgNote('음성 인식 연결을 새 소켓으로 무중단 교체했어요');
          return;
        }
        sttOpen = true;
        sttReconnectAttempts = 0;
        addSystemLine('한국어 음성 인식이 연결되었어요');
        updateReady();
        if (micOn) setStatus('listening', '듣고 있어요'); // 재연결 중 표시를 되돌림
        return;
      }
      if (msg.goAway) { if (sock === wsStt) onSttGoAway(msg.goAway.timeLeft); return; }
      const sc = msg.serverContent;
      if (!sc || sock !== wsStt) return;
      if (sc.interimInputTranscription && sc.interimInputTranscription.text != null) {
        onSttInterim(cleanTranscript(sc.interimInputTranscription.text));
      }
      if (sc.inputTranscription && sc.inputTranscription.text != null) {
        onSttFinal(cleanTranscript(sc.inputTranscription.text));
      }
    };

    sock.onerror = (e) => {
      console.error('[STT] WebSocket error:', e);
      addSystemLine('음성 인식 연결 중 오류가 발생했어요.');
    };

    sock.onclose = (e) => {
      console.log('[STT] WebSocket closed - code:', e.code, 'reason:', e.reason);
      if (sock === pendingStt) { pendingStt = null; return; }
      if (wsStt !== sock) return; // 이미 새 소켓으로 교체됨
      sttOpen = false;
      // 화면이 꺼져있거나 탭이 백그라운드면 지금 다시 열어봐야 OS가 또 끊을 뿐이니
      // 폭주 루프를 만들지 않도록 재시도를 미루고, 복귀 시(visibilitychange)에 처리한다.
      if (document.hidden) {
        pendingSttReconnectNeeded = true;
        return;
      }
      // 전용 전사 세션은 최대 10분이라 정상적으로도 끊긴다 - 마이크는 그대로 두고 조용히 다시 연결
      if (sttReconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
        sttReconnectAttempts++;
        // 재연결되는 동안 마이크 소리는 버려지므로(sttOpen=false) 화면에도 알려둔다
        if (micOn) setStatus('', '음성 인식 다시 연결하는 중…');
        const delay = STT_RECONNECT_DELAYS_MS[Math.min(sttReconnectAttempts - 1, STT_RECONNECT_DELAYS_MS.length - 1)];
        setTimeout(async () => {
          try { connectStt(await fetchSttToken()); }
          catch (err) { addSystemLine('음성 인식 재연결에 실패했어요. 새로고침 해주세요.'); }
        }, delay);
      } else {
        setStatus('', '음성 인식 연결 종료됨');
        addSystemLine('음성 인식이 여러 번 끊겨서 새로고침이 필요해요.');
        playDisconnectAlert(true);
      }
    };
  }

  // ---------- WebSocket / Live API ----------
  // 세션 유지 (대화가 길어지면 갑자기 끊기던 문제):
  //  - Live 연결 자체는 약 10분마다 서버가 끊고(GoAway), 압축 설정이 없으면 오디오 세션은 15분을 넘기면 종료된다.
  //  - contextWindowCompression(슬라이딩 윈도우)으로 15분 제한을 없애고,
  //  - sessionResumption 핸들로 연결이 바뀌어도 대화 맥락을 그대로 이어간다.
  //  - GoAway를 받으면 태연이 말을 끝낸 뒤(늦어도 종료 직전) 새 연결을 미리 열어 갈아탄다.
  //  - 예기치 않게 끊기면: 같은 토큰+핸들 → 새 토큰+핸들 → (마지막) 새 세션 순으로 재시도한다.
  const TOKEN_REUSE_MS = 8 * 60 * 1000; // 토큰엔 '현재 시각'이 발급 시점 기준으로 박혀있어서, 너무 오래 재사용하면 시간 안내가 오래된 값으로 굳는다 - GoAway 주기(~10분)마다 대부분 새로 받도록 짧게 둠
  let liveToken = null, liveTokenAt = 0, liveTokenHist = false; // liveTokenHist: 이 토큰의 프롬프트에 DB 직전 대화가 실려 있는지
  let resumeHandle = null;
  let resumeCount = 0; // resumeHandle로 '이어말하기'(세션 재개)한 누적 횟수 - DB 직전대화로 새 세션을 열면 0으로 리셋
  const MAX_SEAMLESS_RESUMES = 2; // 이 횟수를 넘어서 이어말하기를 반복하면, 끊기기 전에 미리 새 세션(+DB 최신 대화)으로 강제 전환한다
  let pendingWs = null;      // 무중단 교체용으로 미리 열어둔 새 소켓
  let pendingReady = false;  // 새 소켓의 setup이 끝나 갈아탈 수 있는 상태인지
  let pendingViaHistory = false; // 세션 핸들 없이 'DB 직전 대화'를 실어 연 새 소켓인지
  // 미리 열어둔 새 소켓으로 갈아타고 옛 소켓은 닫는다. 옛 연결에서 생성 중이던 대답은 이어지지 않으므로 말하다 만 부분은 기록으로 확정한다.
  function swapToPending() {
    const next = pendingWs;
    if (!next) return;
    const old = ws;
    const viaHistory = pendingViaHistory;
    ws = next; pendingWs = null; pendingReady = false; pendingViaHistory = false;
    turnPending = false;
    commitModelText();
    try { old && old.close(); } catch (_) {}
    if (viaHistory) {
      resumeHandle = null; // 옛 세션의 핸들은 새 세션과 무관
      resumeCount = 0; // 새 세션이니 이어말하기 카운트도 리셋
      dbgNote(`Live 연결을 새 세션으로 교체했어요(저장된 직전 대화 ${lastHistoryCount}개로 맥락 유지)`);
      lastHistoryCount = 0;
    } else {
      dbgNote('Live 연결을 새 소켓으로 무중단 교체했어요(대화 맥락 유지)');
    }
    triggerResumeAfterReconnect(); // 옛 소켓이 끊기기 직전 응답을 못 받은 상태였으면 자동으로 이어받는다
  }
  let goAwayTimer = null;
  let contextLost = false;   // 재개에 실패해 새 세션으로 시작한 경우
  let flushRetry = 0;
  // 예기치 않게 끊겼을 때 재연결까지의 대기시간 - 첫 시도는 지체 없이 바로 시도하고,
  // 같은 이유로 또 실패할 때만 점점 늘려서 서버에 폭주 요청을 보내지 않게 한다.
  const LIVE_RECONNECT_DELAYS_MS = [0, 400, 1200];

  function parseDurationMs(d) {
    if (typeof d === 'string') { const n = parseFloat(d); return isFinite(n) ? n * 1000 : 10000; }
    if (d && typeof d === 'object') return (((Number(d.seconds) || 0) + (Number(d.nanos) || 0) / 1e9) * 1000) || 10000;
    return 10000;
  }

  function onGoAway(timeLeft) {
    lastGoAwayAt = Date.now();
    const ms = parseDurationMs(timeLeft);
    dbgNote(`서버가 곧 연결을 끊는다고 알렸어요(GoAway, ${Math.round(ms / 1000)}초 남음) - 새 연결로 갈아탈게요`);
    clearInterval(goAwayTimer);
    const deadline = Date.now() + Math.max(500, ms - 3000);
    goAwayTimer = setInterval(() => {
      if (Date.now() < deadline && isModelSpeaking()) return; // 태연이 말하는 중이면 끝나기를 기다린다
      clearInterval(goAwayTimer); goAwayTimer = null;
      startSeamlessResume();
    }, 300);
  }

  async function startSeamlessResume() {
    if (pendingWs) return;
    try {
      if (resumeHandle && resumeCount < MAX_SEAMLESS_RESUMES) { // 핸들이 있으면 서버 세션 자체를 이어붙인다 (맥락이 그대로 유지됨)
        const token = (liveToken && !liveTokenHist && Date.now() - liveTokenAt < TOKEN_REUSE_MS) ? liveToken : await fetchToken();
        resumeCount++;
        connect(token, { handle: resumeHandle, seamless: true });
      } else {
        // 핸들이 없거나(이 모델은 sessionResumptionUpdate를 안 보낼 수 있다), 이어말하기를 이미 MAX_SEAMLESS_RESUMES번 반복했으면
        // (반복될수록 결국 얼마 안 가 끊기는 걸 봐서, 끊기기를 기다리지 말고) DB에 저장해 둔 직전 대화를 프롬프트에 실은
        // 새 세션을 미리 열어 두었다가 갈아탄다 (fetchToken이 로그 전송을 먼저 마무리한다 → DB에서 최신 대화를 가져옴)
        if (resumeHandle) dbgNote(`이어말하기를 ${resumeCount}번 반복해서, 끊기기 전에 새 세션(+DB 최신 대화)으로 미리 갈아탈게요`);
        else dbgNote('재개 핸들이 없어서, 저장된 직전 대화를 실은 새 세션으로 미리 갈아탈게요');
        const token = await fetchToken({ withHistory: true });
        connect(token, { handle: null, seamless: true, viaHistory: true });
      }
    } catch (e) { console.warn('[디버그] 무중단 교체 준비 실패:', e); }
  }

  async function reconnectLive() {
    const attempt = reconnectAttempts; // 1 ~ MAX
    let handle = resumeHandle;
    if ((attempt >= MAX_RECONNECT_ATTEMPTS && handle) || (handle && resumeCount >= MAX_SEAMLESS_RESUMES)) {
      // 마지막 시도이거나, 이어말하기를 이미 MAX_SEAMLESS_RESUMES번 반복했으면: 이어붙이기를 포기하고 새 세션으로
      handle = null; resumeHandle = null; contextLost = true; resumeCount = 0;
    }
    try {
      const token = (handle && attempt === 1 && liveToken && !liveTokenHist && Date.now() - liveTokenAt < TOKEN_REUSE_MS)
        ? liveToken            // 1차: 같은 토큰 + 핸들로 재개
        : await fetchToken({ withHistory: !handle });  // 2차 이후: 새 토큰 (이어붙일 핸들이 없으면 DB의 직전 대화도 함께)
      if (handle) resumeCount++;
      connect(token, { handle });
    } catch (err) {
      if (err && err.message === 'auth_expired') return; // requireLogin()이 이미 로그인 화면으로 되돌려놨음
      setStatus('', '연결 종료됨');
      addSystemLine('재연결에 실패했어요. 새로고침 해주세요.');
    }
  }

  // ---------- 버스 경로 안내 (Live의 find_bus_route 함수 호출 처리) ----------
  // 태연이 "거기 가려면 몇 번 버스 타?" 같은 질문에 find_bus_route를 호출하면(toolCall),
  // 여기서 (1) 브라우저 GPS로 현재 위치를 잡고 (2) 토큰 서버(/api/bus-route)에 넘겨서
  // 카카오+ODsay로 실제 경로를 조회한 뒤 (3) toolResponse로 결과를 되돌려준다.
  // 확실히 응답(성공/실패)이 오도록, 브라우저 기본 timeout이 안 지켜지는 경우(권한 팝업이 뜬 채
  // 방치되는 등)를 대비해 우리 쪽에서도 별도 타이머로 강제 종료시킨다. 이게 없으면 GPS 요청이
  // 조용히 멈춘 채 함수 호출 자체가 영원히 안 끝나서, 태연이 결과 없이 얼버무리다 턴이 끝나버린다.
  function getCurrentPosition(timeoutMs = 6000) {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) { reject(new Error('geolocation_unsupported')); return; }
      let settled = false;
      const timer = setTimeout(() => {
        if (settled) return;
        settled = true;
        console.warn('[디버그] 위치 정보 요청이 응답 없이 시간 초과됨 (권한 팝업을 못 봤거나, 브라우저/인앱브라우저가 위치를 막았을 수 있음)');
        reject(new Error('geolocation_timeout'));
      }, timeoutMs);
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          if (settled) return;
          settled = true; clearTimeout(timer);
          // accuracy(단위 m)도 같이 넘긴다 - 데스크톱 등 GPS 칩이 없는 환경에서는 Wi-Fi/IP 기반
          // 네트워크 위치추정으로 폴백되는데, 이 경우 accuracy가 수 km~수십 km로 크게 나오면서
          // 실제 위치와 크게 어긋날 수 있다. 예전엔 lat/lng만 쓰고 이 값을 버려서, 위치가 부정확해서
          // 생긴 문제(엉뚱한 목적지 매칭, 경로 없음)인지 다른 문제인지 구분할 방법이 없었다.
          resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy });
        },
        (err) => {
          if (settled) return;
          settled = true; clearTimeout(timer);
          reject(err);
        },
        { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 60000 }
      );
    });
  }

  async function runFindBusRoute(args, cfg = {}) {
    const endpoint = cfg.endpoint || BUS_ROUTE_ENDPOINT;
    const toolName = cfg.toolName || 'find_bus_route';
    const label = cfg.label || '가는 버스 경로';
    const destination = String((args && args.destination) || '').trim();
    console.log(`[디버그] ${toolName} 실행 시작:`, destination);
    if (!destination) return { error: '목적지가 비어있어요.' };
    addSystemLine(`"${destination}" ${label}를 찾는 중…`);
    let pos;
    try {
      pos = await getCurrentPosition();
      console.log('[디버그] 현재 위치 확보:', pos, `(정확도 약 ${Math.round(pos.accuracy || 0)}m)`);
      // accuracy가 너무 크면(예: 5km 이상) GPS가 아니라 Wi-Fi/IP 기반 네트워크 위치추정으로
      // 잡혔을 가능성이 높다 - 특히 데스크톱 브라우저에서 흔함. 이 경우 결과가 크게 어긋날 수 있으니
      // 검색은 그대로 진행하되, 콘솔과 화면에 눈에 띄게 경고를 남겨서 원인 파악이 빠르게 되도록 한다.
      if (pos.accuracy && pos.accuracy > 5000) {
        console.warn(`[디버그] 위치 정확도가 낮음(약 ${Math.round(pos.accuracy / 1000)}km) - GPS가 아니라 네트워크 기반 추정치일 수 있음. 데스크톱이거나 실내에서 테스트 중이라면 결과가 실제 위치와 크게 어긋날 수 있음`);
        addSystemLine(`(위치가 좀 부정확할 수 있어요 - 오차범위 약 ${Math.round(pos.accuracy / 1000)}km)`);
      }
    } catch (e) {
      console.warn('[디버그] 위치 정보를 가져오지 못함:', e);
      return { error: '현재 위치를 확인할 수 없었어요(위치 권한이 없거나 시간이 초과됨). 위치 권한을 허용한 뒤 다시 물어봐 달라고 안내할 것.' };
    }
    try {
      console.log(`[디버그] ${endpoint} 호출 시작`);
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ lat: pos.lat, lng: pos.lng, destination })
      });
      const data = await res.json().catch(() => ({}));
      console.log(`[디버그] ${endpoint} 응답:`, res.status, data);
      if (!res.ok) return { error: data.error || '경로 조회에 실패했어요.' };
      return data;
    } catch (e) {
      console.warn('[디버그] 버스 경로 서버 호출 실패:', e);
      return { error: '경로 서버에 연결할 수 없었어요.' };
    }
  }

  async function handleToolCall(sock, toolCall) {
    const calls = toolCall.functionCalls || [];
    const responses = [];
    for (const call of calls) {
      console.log('[디버그] toolCall 수신:', call.name, call.args);
      let response;
      try {
        if (call.name === 'find_bus_route') response = await runFindBusRoute(call.args || {});
        else if (call.name === 'find_intercity_route') response = await runFindBusRoute(call.args || {}, { endpoint: INTERCITY_ROUTE_ENDPOINT, toolName: 'find_intercity_route', label: '가는 기차/고속버스 편' });
        else response = { error: '알 수 없는 함수예요.' };
      } catch (e) {
        console.warn('[디버그] 함수 호출 처리 중 오류:', e);
        response = { error: '경로를 찾는 중 오류가 발생했어요.' };
      }
      responses.push({ id: call.id, name: call.name, response });
    }
    if (responses.length && sock.readyState === WebSocket.OPEN) {
      sock.send(JSON.stringify({ toolResponse: { functionResponses: responses } }));
    }
  }

  function connect(token, opts = {}) {
    const handle = opts.handle || null;
    const seamless = !!opts.seamless;
    if (!seamless) setStatus('', '연결하는 중…');
    const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContentConstrained?access_token=${encodeURIComponent(token)}`;
    const sock = new WebSocket(url);
    if (seamless) { pendingWs = sock; pendingReady = false; pendingViaHistory = !!opts.viaHistory; } else ws = sock;

    sock.onopen = () => {
      sock.send(JSON.stringify({
        setup: {
          model: MODEL,
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } }
            }
          },
          // 가끔 질문을 했는데도 태연이 응답을 아예 안 하고 먹통이 되는 증상 대응:
          // 서버 VAD가 '발화가 끝났다'는 판단을 못 내려서(주변 소음 등으로 완전한 무음 구간이
          // 안 만들어짐) 턴 자체가 시작되지 않는 경우로 추정됨. 시작/종료 민감도를 높이고
          // 종료로 판단하는 데 필요한 무음 시간을 짧게 줘서, 애매한 상황에서도 턴이 웬만하면
          // 닫히도록(먹통보다는 문장이 살짝 일찍 끊기는 쪽을 택함) 조정.
          realtimeInputConfig: {
            automaticActivityDetection: {
              startOfSpeechSensitivity: "START_SENSITIVITY_HIGH",
              endOfSpeechSensitivity: "END_SENSITIVITY_HIGH",
              silenceDurationMs: 600
            }
          },
          ...(STT_MODE ? {} : { inputAudioTranscription: {} }),
          outputAudioTranscription: {},
          ...(NO_COMPRESS ? {} : { contextWindowCompression: { slidingWindow: {} } }),
          sessionResumption: handle ? { handle } : {}
        }
      }));
    };

    sock.onmessage = async (event) => {
      let raw = event.data;
      if (raw instanceof Blob) raw = await raw.text();
      let msg;
      try { msg = JSON.parse(raw); } catch (e) { console.log('[디버그] JSON 파싱 실패:', raw); return; }
      if (sock !== ws && sock !== pendingWs) return; // 이미 교체된 옛 소켓
      if (sock === ws) lastLiveMsgAt = Date.now();
      console.log('[디버그] 수신 메시지:', JSON.stringify(msg, (k, v) =>
        (k === 'data' && typeof v === 'string' && v.length > 200) ? `<오디오 ${v.length}자>` : v));

      if (msg.setupComplete) {
        sessionStartAt = Date.now();
        if (sock === pendingWs) { // 새 소켓 준비 완료 - 태연이 말하는 중이 아니면 바로, 아니면 끝나기를 기다렸다가 갈아탄다
          pendingReady = true;
          if (!isModelSpeaking()) swapToPending();
          else {
            const t = setInterval(() => {
              if (!pendingWs || !pendingReady) { clearInterval(t); return; }
              if (!isModelSpeaking()) { clearInterval(t); swapToPending(); }
            }, 200);
          }
          return;
        }
        turnPending = false; // 새 연결로 바뀌면 옛 연결에서 생성 중이던 대답은 이어지지 않는다
        commitModelText();
        sessionOpen = true;
        updateReady();
        if (!STT_MODE) setStatus('live', '연결됨');
        if (reconnectAttempts > 0) { addSystemLine('다시 연결됐어요'); playReconnectedChime(); }
        else addSystemLine('태연과 연결되었어요');
        if (lastHistoryCount > 0) { // 새 세션이지만 DB의 직전 대화를 프롬프트에 실어서 시작한 경우
          addSystemLine(`직전 대화 ${lastHistoryCount}개를 불러와서 이어갈게요`);
          lastHistoryCount = 0; contextLost = false;
        } else if (contextLost) { addSystemLine('연결이 새로 시작되어 이전 대화 내용은 이어지지 않았어요'); contextLost = false; }
        reconnectAttempts = 0;
        triggerResumeAfterReconnect(); // 끊기기 직전 응답을 못 받은 상태였으면 자동으로 이어받는다
        return;
      }

      if (msg.sessionResumptionUpdate) {
        const u = msg.sessionResumptionUpdate;
        if (u.newHandle && u.resumable !== false) resumeHandle = u.newHandle;
        return;
      }
      if (msg.goAway) { if (sock === ws) onGoAway(msg.goAway.timeLeft); return; }
      if (msg.toolCall) { handleToolCall(sock, msg.toolCall); return; }

      const sc = msg.serverContent;
      if (!sc || sock !== ws) return;

      if (sc.inputTranscription && sc.inputTranscription.text) {
        appendText('me', sc.inputTranscription.text);
      }
      if (sc.outputTranscription && sc.outputTranscription.text && !dropModelAudio) {
        turnTranscript += sc.outputTranscription.text;
        modelTextAcc += sc.outputTranscription.text;
        appendText('taeyeon', sc.outputTranscription.text);
        awaitingUserText = ''; // 응답(자막)이 오기 시작했으니 더 이상 '응답 못 받음' 상태가 아님
      }
      if (sc.modelTurn && sc.modelTurn.parts) {
        for (const part of sc.modelTurn.parts) {
          if (part.executableCode || part.codeExecutionResult) turnHadSearch = true; // 서버가 Google 검색 도구를 돌린 턴
          if (part.inlineData && part.inlineData.data) {
            if (dropModelAudio) continue;
            const pcm = int16FromBase64(part.inlineData.data);
            modelTurnActive = true;
            turnPending = false; // 첫 오디오가 왔으니 대기 구간 끝
            awaitingUserText = ''; // 응답(오디오)이 오기 시작했으니 더 이상 '응답 못 받음' 상태가 아님
            if (!turnFirstAudioAt) turnFirstAudioAt = performance.now();
            turnAudioSamples += pcm.length;
            playPcm24k(pcm);
          }
        }
      }
      if (sc.interrupted) {
        console.log('[디버그] 서버가 interrupted 신호를 보냄 - 재생 중단됨');
        turnInterrupted = true;
        dbgNote('서버가 대답을 중단시켰어요(interrupted)');
        // STT 모드에선 내가 새 입력을 보내는 순간 이미 이전 대답을 확정했으니, 그 뒤에 남은 옛 대답 조각은 버린다
        if (STT_MODE) modelTextAcc = ''; else commitModelText();
        stopPlayback();
        dropModelAudio = false;
        curTaeyeonBubble = null; // 끊긴 대답 뒤에 이어지는 새 대답은 새 말풍선으로
      }
      if (sc.turnComplete) {
        if (!STT_MODE && curMeBubble) queueVoiceLog('user', curMeBubble.textContent); // 기본(직접 음성) 모드: 서버 전사로 만들어진 내 말풍선을 기록
        commitModelText();
        logTurnSummary(msg.usageMetadata);
        closeTurn();
        dropModelAudio = false;
        modelTurnActive = false;
        turnPending = false;
      }
    };

    sock.onerror = (e) => {
      if (sock !== ws && sock !== pendingWs) return;
      if (sock === pendingWs) { console.warn('[디버그] 무중단 교체용 연결 오류', e); return; }
      setStatus('', '연결 오류');
      addSystemLine('연결 중 오류가 발생했어요. API 키를 확인해주세요.');
      console.error('WebSocket error:', e);
    };

    sock.onclose = (e) => {
      console.log('WebSocket closed - code:', e.code, 'reason:', e.reason, 'wasClean:', e.wasClean);
      if (sock === pendingWs) { pendingWs = null; pendingReady = false; pendingViaHistory = false; dbgNote('무중단 교체용 새 연결이 열리지 못했어요 - 기존 연결이 끊기면 일반 재연결로 넘어가요'); return; }
      if (sock !== ws) return; // 교체되어 이미 정리된 옛 소켓

      // 끊기기 직전 상태를 캡처: 응답을 하나도 못 받은 채 끊겼는지, 응답이 나오다가 뚝 끊겼는지
      // (swapToPending/일반 재연결 어느 경로로 복구되든 triggerResumeAfterReconnect()가 이 값을 보고 이어받는다)
      if (turnPending && awaitingUserText) {
        resumeUserText = awaitingUserText;
      } else if (modelTurnActive && turnTranscript.trim()) {
        resumeContinueFrag = turnTranscript.trim();
      }
      awaitingUserText = '';
      if (!dropNoticePending) dropAt = Date.now(); // 재연결이 여러 번 실패해도 '처음 끊긴 시각'을 기준으로 잰다
      dropNoticePending = true; // 이 소켓이 예기치 않게 닫힘 -> 복구되면 끊김 멘트를 꼭 하게 함 (계획된 무중단 교체는 여기 안 옴)
      try { sessionStorage.setItem('taeyeon_drop_notice', '1'); sessionStorage.setItem('taeyeon_drop_at', String(dropAt)); } catch (_) {}
      // 곧이어 페이지가 통째로 새로고침될 수도 있는 경로(1007 버그 우회 등)를 대비해 sessionStorage에도 남겨둔다.
      try {
        if (resumeUserText) sessionStorage.setItem('taeyeon_resume_user_text', resumeUserText);
        else if (resumeContinueFrag) sessionStorage.setItem('taeyeon_resume_continue_frag', resumeContinueFrag);
      } catch (_) {}

      if (pendingWs && pendingReady) { // 기존 연결이 먼저 끊겼어도 미리 열어둔 새 연결이 준비돼 있으면 그대로 이어간다
        dbgNote('기존 연결이 끊겼지만 미리 열어둔 새 연결로 바로 이어갈게요');
        swapToPending();
        return;
      }
      if (pendingWs) { // 아직 준비 중인 새 소켓은 버리고 일반 재연결로 (재연결이 새 소켓을 또 만들면서 서로 덮어쓰는 걸 방지)
        const pw = pendingWs; pendingWs = null; pendingReady = false; pendingViaHistory = false;
        try { pw.close(); } catch (_) {}
      }
      turnPending = false;
      commitModelText(); // 연결이 끊겨 말하다 만 대답도 기록으로 남긴다
      dbgNote(`Live 연결이 끊겼어요 (code=${e.code}, reason=${e.reason || '-'})`);
      sessionOpen = false;
      updateReady(); // 텍스트 입력창/전송 버튼도 즉시 잠금

      // 알려진 구글 쪽 버그: 네이티브 오디오 모델(gemini-3.8-live 등)에 마이크 오디오를
      // 직접 realtimeInput.audio로 넣는 기본 모드에서, 세션 도중 간헐적으로
      // "1007 CONTENT_TYPE_AUDIO is not supported for this model configuration"로 끊길 수 있다.
      // 같은 경로로 재연결해도 다시 같은 이유로 끊길 가능성이 높으므로,
      // 오디오를 전용 전사 모델(STT_MODEL)로 우회하는 STT 모드(?stt=1)로 즉시 전환한다.
      // (STT 모드는 이 버그 경로 자체를 안 타므로 우회책이 된다 - 런타임 중 모드를 바꾸는 대신
      //  안전하게 페이지를 ?stt=1로 다시 로드해서 기존 STT 모드 코드 경로를 그대로 재사용한다.)
      if (!STT_MODE && e.code === 1007 && /CONTENT_TYPE_AUDIO/i.test(e.reason || '')) {
        dbgNote('알려진 Gemini Live 버그(1007 CONTENT_TYPE_AUDIO) 감지 - 음성 인식 모드(?stt=1)로 자동 전환합니다');
        addSystemLine('음성 연결에 알려진 문제가 생겨서, 음성 인식 모드로 자동 전환할게요…');
        playDisconnectAlert();
        orb.classList.remove('on');
        orbWrap.classList.remove('active');
        stopMic();
        try { sessionStorage.setItem('taeyeon_stt_fallback_notice', '1'); } catch (_) {}
        const u = new URL(location.href);
        u.searchParams.set('stt', '1');
        setTimeout(() => { location.href = u.toString(); }, 500);
        return;
      }

      // 일반 모드는 마이크 소리를 Live로 직접 보내므로 끄고, STT 모드는 마이크(=음성인식 소켓)를 그대로 둔다
      if (!STT_MODE) {
        orb.classList.remove('on');
        orbWrap.classList.remove('active');
        stopMic();
      }

      // 화면이 꺼져있거나 탭이 백그라운드면 지금 재연결해도 OS가 또 끊을 뿐이니
      // 폭주 루프를 만들지 않도록 미루고, 복귀 시(visibilitychange)에 처리한다.
      if (document.hidden) {
        pendingReconnectNeeded = true;
        return;
      }
      if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
        reconnectAttempts++;
        setStatus('', `재연결 중… (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
        addSystemLine('연결이 끊겨서 다시 연결하고 있어요…');
        playDisconnectAlert();
        const delay = LIVE_RECONNECT_DELAYS_MS[Math.min(reconnectAttempts - 1, LIVE_RECONNECT_DELAYS_MS.length - 1)];
        setTimeout(reconnectLive, delay);
      } else {
        setStatus('', '연결 종료됨');
        addSystemLine('여러 번 재연결에 실패했어요. 새로고침 해주세요.');
        playDisconnectAlert(true);
      }
    };
  }

  // ---------- mic capture (기기 고유 샘플레이트 PCM16, 리샘플링은 Google 서버가 처리) ----------
  async function startMic(opts = {}) {
    // recover(화면 복귀 후 마이크 복구)일 땐 소켓이 재연결 중이어도 일단 마이크부터 다시 잡는다 (전송은 소켓이 열려 있을 때만 됨)
    if (!sessionOpen && !opts.recover) return;
    if (STT_MODE && !sttOpen && !opts.recover) { addSystemLine('음성 인식이 아직 연결 중이에요. 잠시 후 다시 눌러주세요.'); return; }
    console.log('[디버그] getUserMedia 호출 직전');
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      console.log('[디버그] getUserMedia 성공');
    } catch (e) {
      console.log('[디버그] getUserMedia 실패:', e.name, e.message);
      addSystemLine('마이크 권한이 필요해요.');
      return;
    }
    // 브라우저마다 AudioContext의 실제 샘플레이트가 다르다(보통 44100/48000Hz).
    // 예전에는 여기서 직접 16kHz로 줄여서 보냈는데, 저역통과필터 없이 샘플을 솎아내는 방식이라
    // 8kHz 이상의 고주파(ㅅ/ㅆ/ㅈ/ㅊ 같은 마찰음, 배경 잡음)가 앨리어싱으로 음성 대역에 접혀 들어와 소리가 뭉개질 수 있었다.
    // Live API는 어떤 샘플레이트로 보내도 서버에서 리샘플링해 주므로(mimeType의 rate만 정확히 알려주면 됨),
    // 기기 고유 샘플레이트 그대로 보낸다.
    inputCtx = new (window.AudioContext || window.webkitAudioContext)();
    { const c = inputCtx; c.onstatechange = () => console.log('[디버그] inputCtx 상태 변화:', c.state); }
    const actualInputRate = Math.round(inputCtx.sampleRate);
    console.log('[디버그] 입력 AudioContext sampleRate:', actualInputRate, '- 리샘플링 없이 그대로 전송');
    micSource = inputCtx.createMediaStreamSource(micStream);
    micProcessor = inputCtx.createScriptProcessor(4096, 1, 1);

    micProcessor.onaudioprocess = (e) => {
      const target = STT_MODE ? (sttOpen ? wsStt : null) : ws; // STT 모드: 마이크 소리는 음성인식 소켓으로만 간다
      if (!micOn || !target || target.readyState !== WebSocket.OPEN) return;
      // STT 모드 기본값(반이중): 태연이 말하는 동안은 마이크 소리를 보내지 않는다 (스피커 소리가 다시 인식되는 것 방지)
      if (STT_MODE && !BARGE_IN && isModelSpeaking()) return;
      const input = e.inputBuffer.getChannelData(0);
      const int16 = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        int16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      if (DEBUG_AUDIO) dbgPush(int16, actualInputRate);
      const b64 = base64FromInt16(int16);
      target.send(JSON.stringify({
        realtimeInput: { audio: { mimeType: `audio/pcm;rate=${actualInputRate}`, data: b64 } }
      }));
    };

    micSource.connect(micProcessor);
    micProcessor.connect(inputCtx.destination);
    micOn = true;
    setStatus('listening', '듣고 있어요');
  }

  // 마이크 관련 노드/스트림만 정리 (서버로 스트림 종료 신호는 보내지 않음 - 복구용으로도 씀)
  function teardownMic() {
    micOn = false;
    if (micProcessor) { try { micProcessor.disconnect(); } catch (_) {} micProcessor = null; }
    if (micSource) { try { micSource.disconnect(); } catch (_) {} micSource = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (inputCtx) { try { inputCtx.close(); } catch (_) {} inputCtx = null; }
  }

  function stopMic() {
    const endTarget = STT_MODE ? wsStt : ws;
    if (micOn && endTarget && endTarget.readyState === WebSocket.OPEN) {
      // 스트림이 멈추면 서버에 남아있는 마지막 발화 조각을 마무리하라고 알려준다 (Live API 문서 권장)
      endTarget.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } }));
    }
    teardownMic();
    if (sessionOpen) setStatus('live', '연결됨');
  }

  // 반이중 모드에서 마이크가 잠시 닫혀 있다는 걸 알 수 있게 상태 표시
  setInterval(() => {
    if (!STT_MODE || BARGE_IN || !micOn) return;
    if (isModelSpeaking()) setStatus('live', turnPending ? '태연이 생각하는 중… 잠깐만요' : '태연이 말하는 중… 끝나면 말해주세요');
    else if (statusText.textContent.startsWith('태연이')) setStatus('listening', '듣고 있어요');
  }, 250);

  orb.addEventListener('click', async () => {
    console.log('[디버그] 오브 클릭됨. sessionOpen:', sessionOpen, 'micOn:', micOn);
    if (!sessionOpen) { console.log('[디버그] sessionOpen이 false라서 여기서 멈춤'); return; }
    ensureOutputCtx();
    if (!micOn) {
      console.log('[디버그] startMic() 호출 시작');
      await startMic();
      console.log('[디버그] startMic() 완료. micOn:', micOn);
      if (micOn) {
        orb.classList.add('on');
        orbWrap.classList.add('active');
      }
    } else {
      stopMic();
      orb.classList.remove('on');
      orbWrap.classList.remove('active');
    }
  });

  // 버스 경로 기능(find_bus_route)에 쓸 GPS 권한을, 실제 대화 중에 갑자기 물어보면 사용자가 통화에
  // 집중하느라 팝업을 못 보고 넘겨서 요청이 응답 없이 멈추는 문제가 있었다. 그래서 "입장하기"를
  // 누르는 시점(사용자가 화면을 보고 있는, 명확한 사용자 동작 시점)에 미리 한 번 물어봐 둔다.
  // 실패해도(권한 거부 등) 조용히 넘어가고, 실제 함수 호출 시점에 다시 시도한다.
  function primeLocationPermission() {
    if (!navigator.geolocation) return;
    try {
      navigator.geolocation.getCurrentPosition(
        () => console.log('[디버그] 위치 권한 미리 확보됨'),
        (err) => console.log('[디버그] 위치 권한 미리 확인 - 아직 허용 안 됨/거부됨:', err && err.message),
        { timeout: 8000, maximumAge: 300000 }
      );
    } catch (_) {}
  }

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    startBtn.textContent = '연결하는 중…';
    primeLocationPermission(); // 버스 경로 기능용 GPS 권한을, 대화 중간이 아니라 지금(사용자가 화면을 보고 있는 시점)에 미리 물어봐 둔다
    try {
      const [token, sttToken] = await Promise.all([fetchToken({ withHistory: true }), STT_MODE ? fetchSttToken() : Promise.resolve(null)]);
      setup.classList.add('hidden');
      connect(token);
      if (STT_MODE) connectStt(sttToken);
      requestWakeLock(); // 화면이 꺼져서 연결이 끊기는 걸 막기 위해 세션 시작과 동시에 확보 시도
    } catch (e) {
      if (e && e.message === 'auth_expired') return; // requireLogin()이 이미 로그인 화면으로 되돌려놨음
      setupText.textContent = '연결에 실패했어요.';
      setupWarn.style.display = 'block';
      setupWarn.textContent = '토큰 서버에 접속하지 못했어요. TOKEN_ENDPOINT 주소가 맞는지, Railway 서버가 켜져 있는지 확인해주세요.';
      startBtn.disabled = false;
      startBtn.textContent = '다시 시도';
    }
  });

  initAuthAndSetup(); // 로그인 필요 여부를 확인한 뒤 로그인 화면 또는 입장하기 버튼을 보여줌
})();
</script>
</body>
</html>
