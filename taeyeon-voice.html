<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>태연의 타로샵 — 음성으로 묻기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --plum-deep: #1c1220;
    --plum-mid: #2c1d33;
    --violet: #4a2f52;
    --gold: #cf9b4e;
    --gold-soft: #e8c78a;
    --rose: #c07b7f;
    --cream: #f1e7dc;
    --cream-dim: #b7a99a;
    --danger: #a85a4f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at 50% -10%, var(--plum-mid), var(--plum-deep) 60%);
    color: var(--cream);
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    overscroll-behavior: none;
  }
  #app {
    max-width: 480px; margin: 0 auto; height: 100dvh;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* Header */
  header {
    padding: 28px 24px 16px;
    text-align: center;
    border-bottom: 1px solid rgba(232,199,138,0.12);
  }
  header .eyebrow {
    font-size: 12px; letter-spacing: 0.02em; color: var(--cream-dim);
    margin: 0 0 6px;
  }
  header h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px; font-weight: 600; margin: 0;
    color: var(--gold-soft);
  }
  header .moon {
    width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 10px;
    background: radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 55%, transparent 75%);
    box-shadow: 0 0 22px rgba(207,155,78,0.35);
  }

  /* Transcript */
  #log {
    flex: 1; overflow-y: auto; padding: 20px 20px 8px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .bubble {
    max-width: 82%; padding: 11px 15px; border-radius: 16px;
    font-size: 15px; line-height: 1.5; white-space: pre-wrap;
  }
  .bubble.taeyeon {
    align-self: flex-start;
    background: var(--violet);
    border-bottom-left-radius: 4px;
    color: var(--cream);
  }
  .bubble.me {
    align-self: flex-end;
    background: rgba(207,155,78,0.16);
    border: 1px solid rgba(207,155,78,0.3);
    border-bottom-right-radius: 4px;
    color: var(--gold-soft);
  }
  .bubble.me.interim { opacity: 0.55; }
  .bubble.system {
    align-self: center;
    background: none; color: var(--cream-dim);
    font-size: 12.5px; padding: 4px 10px;
  }
  #log:empty::before {
    content: "마이크를 켜고 태연에게 말을 걸어보세요";
    display: block; text-align: center; color: var(--cream-dim);
    font-size: 14px; margin-top: 40px;
  }

  /* Control deck */
  #deck {
    padding: 18px 24px calc(28px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    border-top: 1px solid rgba(232,199,138,0.12);
  }
  #status {
    font-size: 13px; color: var(--cream-dim); min-height: 18px;
    display: flex; align-items: center; gap: 6px;
  }
  #status .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--cream-dim);
  }
  #status.live .dot { background: #7fbf8f; box-shadow: 0 0 8px #7fbf8f; }
  #status.listening .dot { background: var(--gold-soft); box-shadow: 0 0 8px var(--gold-soft); animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  #orb-wrap { position: relative; width: 108px; height: 108px; }
  #orb {
    width: 100%; height: 100%; border-radius: 50%;
    border: none; cursor: pointer;
    background: radial-gradient(circle at 38% 32%, #5a3a63, var(--plum-mid) 70%);
    box-shadow: 0 0 0 1px rgba(232,199,138,0.25), 0 10px 30px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  #orb:active { transform: scale(0.96); }
  #orb.on {
    background: radial-gradient(circle at 38% 32%, var(--gold-soft), var(--gold) 60%, #7a4f2e 100%);
    box-shadow: 0 0 0 1px rgba(232,199,138,0.5), 0 0 40px rgba(207,155,78,0.45);
  }
  #orb-ring {
    position: absolute; inset: -10px; border-radius: 50%;
    border: 1px solid rgba(232,199,138,0.35);
    opacity: 0; transition: opacity 0.3s ease;
    pointer-events: none;
  }
  #orb.on ~ #orb-ring, #orb-wrap.active #orb-ring { opacity: 1; animation: ring 1.6s ease-out infinite; }
  @keyframes ring { 0%{ transform: scale(0.9); opacity: 0.6; } 100%{ transform: scale(1.35); opacity: 0; } }
  #orb svg { width: 34px; height: 34px; }

  #hint { font-size: 12px; color: var(--cream-dim); text-align: center; }

  /* Setup overlay */
  #setup {
    position: fixed; inset: 0; background: rgba(12,7,14,0.92);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10;
  }
  #setup .card {
    background: var(--plum-mid); border: 1px solid rgba(232,199,138,0.18);
    border-radius: 18px; padding: 26px 22px; max-width: 380px; width: 100%;
  }
  #setup h2 { font-family: 'Noto Serif KR', serif; font-size: 18px; margin: 0 0 8px; color: var(--gold-soft); }
  #setup p { font-size: 13px; line-height: 1.6; color: var(--cream-dim); margin: 0 0 16px; }
  #setup input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(232,199,138,0.25);
    background: rgba(0,0,0,0.25); color: var(--cream); font-size: 14px; margin-bottom: 12px;
  }
  #setup button {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: var(--gold); color: #2a1a10; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  #setup .warn { font-size: 11.5px; color: var(--rose); margin-top: 10px; line-height: 1.5; }
  #setup.hidden { display: none; }
</style>
</head>
<body>
<div id="app">

  <div id="setup">
    <div class="card">
      <h2>시작하기 전에</h2>
      <p id="setupText">태연과 연결할 준비를 하고 있어요…</p>
      <button id="startBtn" style="display:none;">입장하기</button>
      <div class="warn" id="setupWarn" style="display:none;"></div>
    </div>
  </div>

  <header>
    <div class="moon"></div>
    <p class="eyebrow">연남동, 작은 타로샵</p>
    <h1>태연</h1>
  </header>

  <div id="log"></div>

  <div id="deck">
    <div id="status"><span class="dot"></span><span id="statusText">연결 대기 중</span></div>
    <div id="orb-wrap">
      <button id="orb" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:#e8c78a">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </button>
      <div id="orb-ring"></div>
    </div>
    <div id="hint">누르면 대화 시작 · 다시 누르면 종료</div>
  </div>

</div>

<script>
(() => {
  // Railway에 토큰 서버 배포 후, 여기에 그 주소를 넣으세요.
  // 예: "https://taeyeon-token-server-production.up.railway.app/api/token"
  // token_server.py가 이 HTML 파일을 같은 서비스에서 함께 서빙하므로 같은 오리진(same-origin)이 되어
  // 상대 경로만으로 충분함. 도메인이 바뀌어도 이 줄을 고칠 필요 없음.
  //
  // 접속 모드:
  //  - 기본: 마이크 소리를 Gemini Live(gemini-3.8-live)에 그대로 보냄 (기존 방식)
  //  - ?stt=1 : 한국어 전용 음성인식(gemini-3.5-transcribe-live, ko-KR 고정)이 내 말을 글자로 바꾸고,
  //             그 텍스트만 Live 모델에 전달해서 태연의 목소리로 대답을 받음.
  //             (언어 자동판별이 아랍어/싱할라어 등으로 빗나가는 문제를 피하기 위한 모드)
  //  - &bargein=1 : ?stt=1 에서 태연이 말하는 도중에도 마이크를 열어 끼어들기 허용 (이어폰 권장)
  const Q = new URLSearchParams(location.search);
  const STT_MODE = Q.get('stt') === '1';
  const BARGE_IN = Q.get('bargein') === '1';
  const TOKEN_ENDPOINT = STT_MODE ? "/api/token?mode=stt" : "/api/token";
  const STT_TOKEN_ENDPOINT = "/api/token-stt";
  const STT_LANG = "ko-KR";
  const STT_DEBOUNCE_MS = 600; // 한 번 말하는 동안 여러 조각으로 확정돼도 하나로 묶어서 Live에 보내기 위한 대기 시간

  let MODEL = null; // 하드코딩하지 않고, 토큰 발급 시 서버가 내려주는 model 값을 그대로 사용한다.
                     // (서버의 LIVE_MODEL과 클라이언트가 어긋나면 토큰의 live_connect_constraints와
                     // 충돌해 엉뚱한/구형 모델 경로로 연결될 수 있어서, 항상 서버 기준을 따르게 함)
  // 페르소나(SYSTEM_PROMPT)는 token_server.py에서 토큰 발급 시점에 고정된다.
  // 임시 토큰 방식에서는 여기서 보내는 systemInstruction이 무시되므로 이 파일엔 두지 않는다.
  const $ = (id) => document.getElementById(id);
  const logEl = $('log'), statusEl = $('status'), statusText = $('statusText');
  const orb = $('orb'), orbWrap = $('orb-wrap');
  const setup = $('setup'), setupText = $('setupText'), setupWarn = $('setupWarn'), startBtn = $('startBtn');

  let ws = null;
  let sessionOpen = false;   // socket connected + setupComplete
  let wsStt = null;          // (STT 모드) 한국어 음성인식 소켓
  let sttOpen = false;
  let STT_MODEL = null;
  let sttReconnectAttempts = 0;
  let pendingUserText = '';
  let sendTimer = null;
  let dropModelAudio = false; // 끼어들기 직후, 이미 취소된 이전 대답의 오디오/자막을 버리기 위한 플래그
  let micOn = false;
  let reconnectAttempts = 0;
  const MAX_RECONNECT_ATTEMPTS = 3;

  let inputCtx = null, outputCtx = null;
  let micStream = null, micSource = null, micProcessor = null;
  let playHead = 0; // scheduling cursor for output audio, in outputCtx time
  // ?debug=1 로 접속하면 "서버로 실제 전송되는 내 목소리"를 마지막 15초까지 보관했다가 바로 들어볼 수 있다.
  // (브라우저의 에코/노이즈 처리까지 끝난 뒤의 소리 = Gemini가 실제로 받는 소리)
  const DEBUG_AUDIO = new URLSearchParams(location.search).get('debug') === '1';
  let dbgChunks = [], dbgSamples = 0, dbgRate = 0;
  function dbgPush(int16, rate) {
    dbgRate = rate;
    dbgChunks.push(int16);
    dbgSamples += int16.length;
    while (dbgSamples > rate * 15 && dbgChunks.length > 1) dbgSamples -= dbgChunks.shift().length;
  }
  function dbgWavBlob() {
    const n = dbgSamples, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, dbgRate, true); v.setUint32(28, dbgRate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, n * 2, true);
    let off = 44;
    for (const c of dbgChunks) for (let i = 0; i < c.length; i++, off += 2) v.setInt16(off, c[i], true);
    return new Blob([buf], { type: 'audio/wav' });
  }
  if (DEBUG_AUDIO) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;';
    const btn = document.createElement('button');
    btn.textContent = '서버로 보낸 내 목소리 듣기 (최근 15초)';
    btn.style.cssText = 'padding:9px 14px;border-radius:10px;border:1px solid rgba(232,199,138,0.4);background:none;color:#e8c78a;font-size:12.5px;cursor:pointer;';
    const player = document.createElement('audio');
    player.controls = true; player.style.width = '100%';
    btn.onclick = () => {
      if (!dbgSamples) { addSystemLine('아직 녹음된 소리가 없어요. 마이크를 켜고 말해본 뒤 눌러주세요.'); return; }
      player.src = URL.createObjectURL(dbgWavBlob());
      player.play().catch(() => {});
      addSystemLine(`디버그: ${dbgRate}Hz, ${(dbgSamples / dbgRate).toFixed(1)}초 분량`);
    };
    wrap.append(btn, player);
    document.getElementById('deck').appendChild(wrap);
  }

  const activeSources = new Set(); // 예약/재생 중인 출력 오디오 소스 - 끼어들기(interrupted) 때 한꺼번에 멈추기 위해 추적

  let curTaeyeonBubble = null;
  let curMeBubble = null;

  function addSystemLine(text) {
    const d = document.createElement('div');
    d.className = 'bubble system';
    d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function ensureBubble(who) {
    const cls = who === 'taeyeon' ? 'taeyeon' : 'me';
    const cur = who === 'taeyeon' ? curTaeyeonBubble : curMeBubble;
    if (cur) return cur;
    const d = document.createElement('div');
    d.className = 'bubble ' + cls;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
    if (who === 'taeyeon') curTaeyeonBubble = d; else curMeBubble = d;
    return d;
  }
  function appendText(who, text) {
    const b = ensureBubble(who);
    b.textContent = (b.textContent || '') + text;
    logEl.scrollTop = logEl.scrollHeight;
  }
  function closeTurn() {
    curTaeyeonBubble = null;
    if (!STT_MODE) curMeBubble = null; // STT 모드에선 내 말풍선을 STT 이벤트가 직접 관리
  }

  function setStatus(mode, text) {
    statusEl.className = mode;
    statusText.textContent = text;
  }

  // ---------- base64 helpers ----------
  function base64FromInt16(int16arr) {
    const bytes = new Uint8Array(int16arr.buffer);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }
  function int16FromBase64(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Int16Array(bytes.buffer);
  }

  // ---------- output playback (24kHz PCM16) ----------
  function playPcm24k(int16arr) {
    if (!outputCtx) return;
    const float32 = new Float32Array(int16arr.length);
    for (let i = 0; i < int16arr.length; i++) float32[i] = int16arr[i] / 32768;
    const buffer = outputCtx.createBuffer(1, float32.length, 24000);
    buffer.copyToChannel(float32, 0);
    const src = outputCtx.createBufferSource();
    src.buffer = buffer;
    src.connect(outputCtx.destination);
    activeSources.add(src);
    src.onended = () => activeSources.delete(src);
    const now = outputCtx.currentTime;
    if (playHead < now) playHead = now + 0.05;
    src.start(playHead);
    playHead += buffer.duration;
  }

  // 서버가 interrupted를 보내면, 이미 예약해 둔 오디오도 전부 멈춰야 한다.
  // (playHead만 되돌리면 예약된 소스는 그대로 재생돼서 옛 대답이 겹쳐 들리고, 그게 다시 마이크로 들어간다)
  function stopPlayback() {
    activeSources.forEach((s) => { try { s.stop(); } catch (_) {} });
    activeSources.clear();
    playHead = outputCtx ? outputCtx.currentTime : 0;
  }

  // ---------- token fetch ----------
  async function fetchToken() {
    const res = await fetch(TOKEN_ENDPOINT, { method: 'POST' });
    if (!res.ok) throw new Error('token fetch failed: ' + res.status);
    const data = await res.json();
    if (data.model) MODEL = data.model;
    return data.token;
  }

  async function fetchSttToken() {
    const res = await fetch(STT_TOKEN_ENDPOINT, { method: 'POST' });
    if (!res.ok) throw new Error('stt token fetch failed: ' + res.status);
    const data = await res.json();
    if (data.model) STT_MODEL = data.model;
    return data.token;
  }

  // 태연이 지금(또는 방금까지) 말하고 있는지 - 스피커 소리가 마이크로 들어가 STT가 태연의 목소리를 내 말로 듣는 것을 막기 위함
  function isModelSpeaking() {
    return !!outputCtx && playHead > 0 && outputCtx.currentTime < playHead + 0.4; // playHead==0 이면 아직 한 번도 재생한 적 없음
  }

  function updateReady() {
    const ready = sessionOpen && (!STT_MODE || sttOpen);
    orb.disabled = !ready;
    if (!micOn) {
      if (ready) setStatus('live', '연결됨');
      else if (sessionOpen && STT_MODE) setStatus('', '음성 인식 연결하는 중…');
    }
  }

  // ---------- (STT 모드) 한국어 음성인식 WebSocket ----------
  function cleanTranscript(t) {
    return (t || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function onSttInterim(text) {
    if (!text) return;
    if (BARGE_IN && isModelSpeaking()) { // 끼어들기: 태연 재생을 즉시 멈추고, 취소된 대답의 남은 오디오는 버림
      stopPlayback();
      dropModelAudio = true;
    }
    const b = ensureBubble('me');
    b.classList.add('interim');
    b.textContent = text;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function onSttFinal(text) {
    if (!text) { // 빈 결과면 임시 말풍선 정리
      if (curMeBubble) { curMeBubble.remove(); curMeBubble = null; }
      return;
    }
    const b = ensureBubble('me');
    b.classList.remove('interim');
    b.textContent = text;
    curMeBubble = null;
    logEl.scrollTop = logEl.scrollHeight;
    pendingUserText = (pendingUserText + ' ' + text).trim();
    clearTimeout(sendTimer);
    sendTimer = setTimeout(flushUserText, STT_DEBOUNCE_MS);
  }

  function flushUserText() {
    sendTimer = null;
    const text = pendingUserText.trim();
    pendingUserText = '';
    if (!text) return;
    if (!sessionOpen || !ws || ws.readyState !== WebSocket.OPEN) {
      addSystemLine('연결이 끊겨 있어서 방금 한 말이 전달되지 못했어요.');
      return;
    }
    dropModelAudio = false; // 새 턴 시작
    console.log('[디버그] Live로 전송할 텍스트:', text);
    ws.send(JSON.stringify({ realtimeInput: { text } }));
  }

  function connectStt(token) {
    const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContentConstrained?access_token=${encodeURIComponent(token)}`;
    const sock = new WebSocket(url);
    wsStt = sock;

    sock.onopen = () => {
      sock.send(JSON.stringify({
        setup: {
          model: STT_MODEL,
          generationConfig: { responseModalities: ["TEXT"] },
          inputAudioTranscription: { languageCodes: [STT_LANG] }
        }
      }));
    };

    sock.onmessage = async (event) => {
      let raw = event.data;
      if (raw instanceof Blob) raw = await raw.text();
      let msg;
      try { msg = JSON.parse(raw); } catch (e) { console.log('[디버그][STT] JSON 파싱 실패:', raw); return; }
      console.log('[디버그][STT] 수신:', JSON.stringify(msg));

      if (msg.setupComplete) {
        sttOpen = true;
        sttReconnectAttempts = 0;
        addSystemLine('한국어 음성 인식이 연결되었어요');
        updateReady();
        return;
      }
      const sc = msg.serverContent;
      if (!sc) return;
      if (sc.interimInputTranscription && sc.interimInputTranscription.text != null) {
        onSttInterim(cleanTranscript(sc.interimInputTranscription.text));
      }
      if (sc.inputTranscription && sc.inputTranscription.text != null) {
        onSttFinal(cleanTranscript(sc.inputTranscription.text));
      }
    };

    sock.onerror = (e) => {
      console.error('[STT] WebSocket error:', e);
      addSystemLine('음성 인식 연결 중 오류가 발생했어요.');
    };

    sock.onclose = (e) => {
      console.log('[STT] WebSocket closed - code:', e.code, 'reason:', e.reason);
      if (wsStt !== sock) return; // 이미 새 소켓으로 교체됨
      sttOpen = false;
      // 전용 전사 세션은 최대 10분이라 정상적으로도 끊긴다 - 마이크는 그대로 두고 조용히 다시 연결
      if (sttReconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
        sttReconnectAttempts++;
        setTimeout(async () => {
          try { connectStt(await fetchSttToken()); }
          catch (err) { addSystemLine('음성 인식 재연결에 실패했어요. 새로고침 해주세요.'); }
        }, 500);
      } else {
        setStatus('', '음성 인식 연결 종료됨');
        addSystemLine('음성 인식이 여러 번 끊겨서 새로고침이 필요해요.');
      }
    };
  }

  // ---------- WebSocket / Live API ----------
  function connect(token) {
    setStatus('', '연결하는 중…');
    const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContentConstrained?access_token=${encodeURIComponent(token)}`;
    ws = new WebSocket(url);

    ws.onopen = () => {
      ws.send(JSON.stringify({
        setup: {
          model: MODEL,
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: { prebuiltVoiceConfig: { voiceName: "Despina" } }
            }
          },
          ...(STT_MODE ? {} : { inputAudioTranscription: {} }),
          outputAudioTranscription: {}
        }
      }));
    };

    ws.onmessage = async (event) => {
      let raw = event.data;
      if (raw instanceof Blob) raw = await raw.text();
      let msg;
      try { msg = JSON.parse(raw); } catch (e) { console.log('[디버그] JSON 파싱 실패:', raw); return; }
      console.log('[디버그] 수신 메시지:', JSON.stringify(msg, (k, v) =>
        (k === 'data' && typeof v === 'string' && v.length > 200) ? `<오디오 ${v.length}자>` : v));

      if (msg.setupComplete) {
        sessionOpen = true;
        updateReady();
        if (!STT_MODE) setStatus('live', '연결됨');
        addSystemLine(reconnectAttempts > 0 ? '다시 연결됐어요' : '태연과 연결되었어요');
        reconnectAttempts = 0;
        return;
      }

      const sc = msg.serverContent;
      if (!sc) return;

      if (sc.inputTranscription && sc.inputTranscription.text) {
        appendText('me', sc.inputTranscription.text);
      }
      if (sc.outputTranscription && sc.outputTranscription.text && !dropModelAudio) {
        appendText('taeyeon', sc.outputTranscription.text);
      }
      if (sc.modelTurn && sc.modelTurn.parts) {
        for (const part of sc.modelTurn.parts) {
          if (part.inlineData && part.inlineData.data) {
            if (dropModelAudio) continue;
            const pcm = int16FromBase64(part.inlineData.data);
            playPcm24k(pcm);
          }
        }
      }
      if (sc.interrupted) {
        console.log('[디버그] 서버가 interrupted 신호를 보냄 - 재생 중단됨');
        stopPlayback();
        dropModelAudio = false;
        curTaeyeonBubble = null; // 끊긴 대답 뒤에 이어지는 새 대답은 새 말풍선으로
      }
      if (sc.turnComplete) {
        closeTurn();
        dropModelAudio = false;
      }
    };

    ws.onerror = (e) => {
      setStatus('', '연결 오류');
      addSystemLine('연결 중 오류가 발생했어요. API 키를 확인해주세요.');
      console.error('WebSocket error:', e);
    };

    ws.onclose = (e) => {
      sessionOpen = false;
      orb.classList.remove('on');
      orbWrap.classList.remove('active');
      stopMic();
      console.log('WebSocket closed - code:', e.code, 'reason:', e.reason, 'wasClean:', e.wasClean);

      if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
        reconnectAttempts++;
        setStatus('', `재연결 중… (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
        addSystemLine('연결이 끊겨서 다시 연결하고 있어요…');
        setTimeout(async () => {
          try {
            const token = await fetchToken();
            connect(token);
          } catch (err) {
            setStatus('', '연결 종료됨');
            addSystemLine('재연결에 실패했어요. 새로고침 해주세요.');
          }
        }, 800);
      } else {
        setStatus('', '연결 종료됨');
        addSystemLine('여러 번 재연결에 실패했어요. 새로고침 해주세요.');
      }
    };
  }

  // ---------- mic capture (기기 고유 샘플레이트 PCM16, 리샘플링은 Google 서버가 처리) ----------
  async function startMic() {
    if (!sessionOpen) return;
    if (STT_MODE && !sttOpen) { addSystemLine('음성 인식이 아직 연결 중이에요. 잠시 후 다시 눌러주세요.'); return; }
    console.log('[디버그] getUserMedia 호출 직전');
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      console.log('[디버그] getUserMedia 성공');
    } catch (e) {
      console.log('[디버그] getUserMedia 실패:', e.name, e.message);
      addSystemLine('마이크 권한이 필요해요.');
      return;
    }
    // 브라우저마다 AudioContext의 실제 샘플레이트가 다르다(보통 44100/48000Hz).
    // 예전에는 여기서 직접 16kHz로 줄여서 보냈는데, 저역통과필터 없이 샘플을 솎아내는 방식이라
    // 8kHz 이상의 고주파(ㅅ/ㅆ/ㅈ/ㅊ 같은 마찰음, 배경 잡음)가 앨리어싱으로 음성 대역에 접혀 들어와 소리가 뭉개질 수 있었다.
    // Live API는 어떤 샘플레이트로 보내도 서버에서 리샘플링해 주므로(mimeType의 rate만 정확히 알려주면 됨),
    // 기기 고유 샘플레이트 그대로 보낸다.
    inputCtx = new (window.AudioContext || window.webkitAudioContext)();
    const actualInputRate = Math.round(inputCtx.sampleRate);
    console.log('[디버그] 입력 AudioContext sampleRate:', actualInputRate, '- 리샘플링 없이 그대로 전송');
    micSource = inputCtx.createMediaStreamSource(micStream);
    micProcessor = inputCtx.createScriptProcessor(4096, 1, 1);

    micProcessor.onaudioprocess = (e) => {
      const target = STT_MODE ? (sttOpen ? wsStt : null) : ws; // STT 모드: 마이크 소리는 음성인식 소켓으로만 간다
      if (!micOn || !target || target.readyState !== WebSocket.OPEN) return;
      // STT 모드 기본값(반이중): 태연이 말하는 동안은 마이크 소리를 보내지 않는다 (스피커 소리가 다시 인식되는 것 방지)
      if (STT_MODE && !BARGE_IN && isModelSpeaking()) return;
      const input = e.inputBuffer.getChannelData(0);
      const int16 = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        int16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      if (DEBUG_AUDIO) dbgPush(int16, actualInputRate);
      const b64 = base64FromInt16(int16);
      target.send(JSON.stringify({
        realtimeInput: { audio: { mimeType: `audio/pcm;rate=${actualInputRate}`, data: b64 } }
      }));
    };

    micSource.connect(micProcessor);
    micProcessor.connect(inputCtx.destination);
    micOn = true;
    setStatus('listening', '듣고 있어요');
  }

  function stopMic() {
    const endTarget = STT_MODE ? wsStt : ws;
    if (micOn && endTarget && endTarget.readyState === WebSocket.OPEN) {
      // 스트림이 멈추면 서버에 남아있는 마지막 발화 조각을 마무리하라고 알려준다 (Live API 문서 권장)
      endTarget.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } }));
    }
    micOn = false;
    if (micProcessor) { micProcessor.disconnect(); micProcessor = null; }
    if (micSource) { micSource.disconnect(); micSource = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (inputCtx) { inputCtx.close(); inputCtx = null; }
    if (sessionOpen) setStatus('live', '연결됨');
  }

  orb.addEventListener('click', async () => {
    console.log('[디버그] 오브 클릭됨. sessionOpen:', sessionOpen, 'micOn:', micOn);
    if (!sessionOpen) { console.log('[디버그] sessionOpen이 false라서 여기서 멈춤'); return; }
    if (!outputCtx) outputCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    if (!micOn) {
      console.log('[디버그] startMic() 호출 시작');
      await startMic();
      console.log('[디버그] startMic() 완료. micOn:', micOn);
      if (micOn) {
        orb.classList.add('on');
        orbWrap.classList.add('active');
      }
    } else {
      stopMic();
      orb.classList.remove('on');
      orbWrap.classList.remove('active');
    }
  });

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    startBtn.textContent = '연결하는 중…';
    try {
      const [token, sttToken] = await Promise.all([fetchToken(), STT_MODE ? fetchSttToken() : Promise.resolve(null)]);
      setup.classList.add('hidden');
      connect(token);
      if (STT_MODE) connectStt(sttToken);
    } catch (e) {
      setupText.textContent = '연결에 실패했어요.';
      setupWarn.style.display = 'block';
      setupWarn.textContent = '토큰 서버에 접속하지 못했어요. TOKEN_ENDPOINT 주소가 맞는지, Railway 서버가 켜져 있는지 확인해주세요.';
      startBtn.disabled = false;
      startBtn.textContent = '다시 시도';
    }
  });

  // 초기 화면: 바로 입장 버튼 노출
  setupText.textContent = STT_MODE
    ? '태연과 실시간 음성 대화를 시작해요. (한국어 전용 음성 인식 모드)'
    : '태연과 실시간 음성 대화를 시작해요.';
  startBtn.style.display = 'block';
})();
</script>
